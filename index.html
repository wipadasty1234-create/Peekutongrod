        .join('')
    : `<div class="empty-state"><p>ยังไม่มีข้อมูลต้นทุนในช่วงนี้</p></div>`;

  const weekdayRowsHtml = weekday.buckets
    .map(
      (b) => `
      <div class="row-item">
        <span class="label">${b.name}${b.days_count > 0 ? ` <span style="color:var(--ink-soft);font-size:12px;">(${b.days_count} วัน)</span>` : ''}</span>
        <span class="value ${b.days_count > 0 ? (b.avg_profit >= 0 ? 'profit-pos' : 'profit-neg') : ''}">${b.days_count > 0 ? formatMoney(b.avg_profit) + '/วัน' : '—'}</span>
      </div>`
    )
    .join('');

  const weekdaySuggestionHtml = weekday.suggestion
    ? `<p style="font-size:13px;color:var(--ink-soft);margin-top:10px;">
         จากข้อมูลในช่วงนี้ <strong style="color:var(--ink);">วัน${weekday.suggestion.name}</strong> มีกำไรเฉลี่ยต่ำสุด (${formatMoney(weekday.suggestion.avg_profit)}/วัน)
         ${weekday.suggestion.avg_profit < 0 ? ' และขาดทุนโดยเฉลี่ย น่าจะลองพิจารณาหยุดร้านวันนี้ดู' : ' ลองเทียบกับต้นทุนคงที่ที่ยังต้องจ่ายแม้ปิดร้าน ก่อนตัดสินใจ'}
       </p>`
    : `<p style="font-size:13px;color:var(--ink-soft);margin-top:10px;">ต้องมีข้อมูลอย่างน้อย 2 ครั้งของแต่ละวัน และครบอย่างน้อย 3 วันในสัปดาห์ที่ต่างกัน ถึงจะวิเคราะห์ได้แม่นยำพอ — บันทึกยอดขายต่อไปเรื่อยๆ แล้วกลับมาดูใหม่</p>`;

  $content.innerHTML = `
    <h1 class="section-title">รายงาน</h1>

    <div class="card">
      <h2>ช่วงวันที่ดูรายงาน</h2>
      <div class="field-grid">
        <div class="field">
          <label for="rep-from">จากวันที่</label>
          <input type="date" id="rep-from" value="${from}" max="${today}" />
        </div>
        <div class="field">
          <label for="rep-to">ถึงวันที่</label>
          <input type="date" id="rep-to" value="${to}" max="${today}" />
        </div>
      </div>
    </div>

    <div class="card">
      <h2>กำไรเฉลี่ยตามวันในสัปดาห์ (แนะนำวันหยุดร้าน)</h2>
      ${buildWeekdayChartSvg(weekday.buckets)}
      <div class="row-list" style="margin-top:10px;">${weekdayRowsHtml}</div>
      ${weekdaySuggestionHtml}
    </div>

    <div class="card">
      <h2>เมนูขายดี</h2>
      <div class="row-list">${topItemsHtml}</div>
    </div>

    <div class="card">
      <h2>สรุปรายเดือน</h2>
      ${monthlyHtml}
    </div>

    <div class="card">
      <h2>ต้นทุนแยกตามหมวดหมู่</h2>
      ${expenseBreakdown.length ? buildExpensePieChartSvg(expenseBreakdown) : ''}
      <div style="margin-top:14px;">${expenseBreakdownHtml}</div>
    </div>
  `;

  document.getElementById('rep-from').addEventListener('change', (e) => {
    renderReports(e.target.value, document.getElementById('rep-to').value);
  });
  document.getElementById('rep-to').addEventListener('change', (e) => {
    renderReports(document.getElementById('rep-from').value, e.target.value);
  });
}

// ------------------------------------------------------------
// View: วัตถุดิบ / สต็อก (Ingredients)
// ------------------------------------------------------------
let ingredientsDetailId = null;
let ingredientsActiveCategory = 'ทั้งหมด';
let ingredientsLedgerDate = todayStr();
let ingredientsSummaryTab = 'daily'; // 'daily' = สรุปวัตถุดิบรายวัน | 'trend' = แนวโน้มการใช้วัตถุดิบ
let ingredientsActionTab = 'purchase'; // 'purchase' = บันทึกซื้อเข้า | 'count' = นับสต็อกปิดร้าน
let ingredientsHistoryTab = 'purchases'; // 'purchases' = ประวัติซื้อ | 'counts' = ประวัตินับสต็อก
let ingredientsHistoryOpen = false; // แผงประวัติ พับ/กาง

async function renderIngredients(detailId) {
  if (detailId !== undefined) ingredientsDetailId = detailId;

  const today = todayStr();
  const allIngredients = await listIngredients({ activeOnly: true });
  const categoriesInUse = [...new Set(allIngredients.map((i) => i.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'th'));
  const suggestedCategories = ['ของสด', 'ผัก', 'เนื้อสัตว์', 'ขนมหวาน', CONSUMABLE_CATEGORY];
  const allCategoryOptions = [...new Set([...suggestedCategories, ...categoriesInUse])];
  const hasUncategorized = allIngredients.some((i) => !i.category);

  const categoryTabs = ['ทั้งหมด', ...categoriesInUse, ...(hasUncategorized ? ['ไม่ระบุหมวดหมู่'] : [])];
  if (!categoryTabs.includes(ingredientsActiveCategory)) ingredientsActiveCategory = 'ทั้งหมด';

  const ingredients =
    ingredientsActiveCategory === 'ทั้งหมด'
      ? allIngredients
      : ingredientsActiveCategory === 'ไม่ระบุหมวดหมู่'
      ? allIngredients.filter((i) => !i.category)
      : allIngredients.filter((i) => i.category === ingredientsActiveCategory);

  const lowStock = new Set((await listLowStockIngredients()).map((i) => i.id));
  const overdueList = await listOverdueStockCounts(today);
  const overdueMap = Object.fromEntries(overdueList.map((o) => [o.ingredient.id, o.reason]));
  const uncountedToday = await listIngredientsUncountedToday(today);
  const todayEntry = await db.daily_entries.where('entry_date').equals(today).first();
  const todayClosed = todayEntry?.is_closed === true;
  const ledgerRows = await getDailyIngredientLedger(ingredientsLedgerDate);

  // ---------- ตารางสรุปวัตถุดิบทั้งหมด ----------
  const tableRowsHtml = ingredients.length
    ? ingredients
        .map((ing) => {
          const stamps = [];
          if (lowStock.has(ing.id)) stamps.push(`<span class="stamp warn">ใกล้หมด</span>`);
          if (overdueMap[ing.id]) stamps.push(`<span class="stamp warn">${escapeHtml(overdueMap[ing.id])}</span>`);
          if (stamps.length === 0) stamps.push(`<span class="stamp ok">ปกติ</span>`);
          const selected = ingredientsDetailId === ing.id;

          return `
        <tr data-ingredient-row="${ing.id}" style="cursor:pointer;${selected ? 'background:var(--paper-deep);' : ''}">
          <td style="padding:10px 8px;border-bottom:1px solid var(--line);font-weight:700;color:var(--ink);"><div style="display:flex;align-items:center;">${categoryDotHtml(ing.category)}${escapeHtml(ing.name)}</div></td>
          <td style="padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;">${ing.current_stock} ${escapeHtml(ing.unit)}</td>
          <td style="padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;">${formatMoney(ing.current_avg_cost)}</td>
          <td style="padding:10px 8px;border-bottom:1px solid var(--line);"><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start;">${stamps.join('')}</div></td>
        </tr>`;
        })
        .join('')
    : `<tr><td colspan="4" style="padding:16px 8px;"><div class="empty-state"><p>ยังไม่มีวัตถุดิบ</p><p>เพิ่มรายการแรกด้านบนได้เลย</p></div></td></tr>`;

  const categoryTabsHtml = `
    <div style="display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;">
      ${categoryTabs
        .map((c) => {
          const isSpecial = c === 'ทั้งหมด' || c === 'ไม่ระบุหมวดหมู่';
          const color = isSpecial ? { bg: 'var(--paper-deep)', text: 'var(--ink-soft)' } : getCategoryColor(c);
          const active = c === ingredientsActiveCategory;
          const style = active
            ? `background:${color.text};color:var(--white);border:1.5px solid ${color.text};white-space:nowrap;`
            : `background:${color.bg};color:${color.text};border:1.5px solid transparent;white-space:nowrap;`;
          return `<button class="btn btn-small" data-select-ing-category="${escapeHtml(c)}" style="${style}">${escapeHtml(c)}</button>`;
        })
        .join('')}
    </div>`;

  const tableHtml = `
    ${categoryTabsHtml}
    <div class="card" style="padding:0;overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:14px;">
        <thead>
          <tr style="text-align:left;color:var(--ink-soft);font-size:12px;">
            <th style="padding:10px 8px;">วัตถุดิบ</th>
            <th style="padding:10px 8px;text-align:right;">คงเหลือ</th>
            <th style="padding:10px 8px;text-align:right;">ต้นทุน/หน่วย</th>
            <th style="padding:10px 8px;">สถานะ</th>
          </tr>
        </thead>
        <tbody>${tableRowsHtml}</tbody>
      </table>
    </div>`;

  // ---------- แผงรายละเอียด (เปิดเมื่อแตะแถวในตาราง) ----------
  const selectedIng = ingredientsDetailId ? allIngredients.find((i) => i.id === ingredientsDetailId) : null;
  let detailHtml = '';

  if (selectedIng) {
    const lots = await db.ingredient_purchases.where('ingredient_id').equals(selectedIng.id).sortBy('purchase_date');
    const lotsDesc = lots.slice().reverse();
    const lotsRowsHtml = lotsDesc.length
      ? lotsDesc
          .map(
            (p) => `
          <tr data-purchase-id="${p.id}">
            <td style="padding:7px 6px;border-bottom:1px solid var(--line);"><input type="date" class="edit-purchase-date" value="${p.purchase_date}" style="font-size:12px;padding:4px;" /></td>
            <td style="padding:7px 6px;border-bottom:1px solid var(--line);"><input type="number" min="0" step="any" class="edit-purchase-qty" value="${p.quantity}" style="width:60px;text-align:right;font-size:12px;padding:4px;" /></td>
            <td style="padding:7px 6px;border-bottom:1px solid var(--line);"><input type="number" min="0" step="any" class="edit-purchase-cost" value="${p.unit_cost}" style="width:64px;text-align:right;font-size:12px;padding:4px;" /></td>
            <td style="padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;">
              <button class="btn-ghost" data-save-purchase="${p.id}" style="padding:3px 6px;font-size:11px;">บันทึก</button>
              <button class="btn-danger-text" data-remove-purchase="${p.id}" style="font-size:11px;">ลบ</button>
            </td>
          </tr>`
          )
          .join('')
      : `<tr><td colspan="4" style="padding:10px 6px;color:var(--ink-soft);">ยังไม่มีประวัติซื้อ</td></tr>`;

    const counts = await db.ingredient_stock_counts.where('ingredient_id').equals(selectedIng.id).sortBy('count_date');
    const countsDesc = counts.slice().reverse();
    const countsRowsHtml = countsDesc.length
      ? countsDesc
          .map(
            (c) => `
          <tr data-count-id="${c.id}">
            <td style="padding:7px 6px;border-bottom:1px solid var(--line);">${c.count_date}</td>
            <td style="padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;">${c.opening_stock} + ${c.purchased_qty}</td>
            <td style="padding:7px 6px;border-bottom:1px solid var(--line);"><input type="number" step="any" class="edit-count-closing" value="${c.closing_count}" style="width:64px;text-align:right;font-size:12px;padding:4px;" /></td>
            <td style="padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;">${c.used_qty} (${formatMoney(c.used_value)})</td>
            <td style="padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;">
              <button class="btn-ghost" data-save-count="${c.id}" style="padding:3px 6px;font-size:11px;">บันทึก</button>
              <button class="btn-danger-text" data-remove-count="${c.id}" style="font-size:11px;">ลบ</button>
            </td>
          </tr>`
          )
          .join('')
      : `<tr><td colspan="5" style="padding:10px 6px;color:var(--ink-soft);">ยังไม่มีประวัติการนับ</td></tr>`;

    detailHtml = `
    <div class="card" data-ingredient-detail="${selectedIng.id}">
      <div class="row-item" style="border-bottom:none;padding-top:0;">
        <span class="label" style="font-weight:700;color:var(--ink);font-size:16px;">${escapeHtml(selectedIng.name)}</span>
        <button class="btn-danger-text" data-close-detail="1">ปิด ✕</button>
      </div>
      <div class="row-item">
        <span class="label">คงเหลือ</span>
        <span class="value">${selectedIng.current_stock} ${escapeHtml(selectedIng.unit)}</span>
      </div>
      <div class="row-item">
        <span class="label">ต้นทุนเฉลี่ย/หน่วย</span>
        <span class="value">${formatMoney(selectedIng.current_avg_cost)}</span>
      </div>
      <div class="field" style="margin-top:10px;">
        <label for="detail-category">หมวดหมู่</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="detail-category" list="ing-category-options" value="${selectedIng.category ? escapeHtml(selectedIng.category) : ''}" style="flex:1;" />
          <button class="btn btn-ghost btn-small" id="btn-save-category">บันทึก</button>
        </div>
      </div>

      <h3 style="margin-top:14px;">บันทึกรายการ</h3>
      <div class="seg-tabs">
        <button class="seg-tab ${ingredientsActionTab === 'purchase' ? 'active' : ''}" data-action-tab="purchase">+ ซื้อเข้า</button>
        <button class="seg-tab ${ingredientsActionTab === 'count' ? 'active' : ''}" data-action-tab="count">นับสต็อกปิดร้าน</button>
      </div>

      <div id="action-panel-purchase" style="${ingredientsActionTab === 'purchase' ? '' : 'display:none;'}">
        <div class="field-grid">
          <div class="field">
            <label for="detail-purchase-qty">จำนวน (${escapeHtml(selectedIng.unit)})</label>
            <input type="number" min="0" step="any" id="detail-purchase-qty" />
          </div>
          <div class="field">
            <label for="detail-purchase-cost">ราคา/หน่วย (บาท)</label>
            <input type="number" min="0" step="any" id="detail-purchase-cost" />
          </div>
        </div>
        <input type="date" id="detail-purchase-date" value="${today}" style="margin-bottom:10px;" />
        <button class="btn btn-ghost btn-small" id="btn-detail-save-purchase">บันทึกซื้อเข้า</button>
      </div>

      <div id="action-panel-count" style="${ingredientsActionTab === 'count' ? '' : 'display:none;'}">
        <div class="field-grid">
          <div class="field">
            <label for="detail-count-closing">จำนวนที่นับได้ (${escapeHtml(selectedIng.unit)})</label>
            <input type="number" min="0" step="any" id="detail-count-closing" />
          </div>
          <div class="field">
            <label for="detail-count-date">วันที่นับ</label>
            <input type="date" id="detail-count-date" value="${today}" />
          </div>
        </div>
        <button class="btn btn-primary btn-small" id="btn-detail-save-count">บันทึกนับสต็อก</button>
        <div id="detail-count-result" style="margin-top:8px;font-size:13px;color:var(--ink-soft);"></div>
      </div>

      <button class="btn-edit-text" style="margin-top:16px;" id="btn-toggle-ing-history">${ingredientsHistoryOpen ? 'ซ่อนประวัติ ▲' : 'ดูประวัติซื้อ/นับสต็อก ▾'}</button>

      <div id="ing-history-panel" style="${ingredientsHistoryOpen ? '' : 'display:none;'}margin-top:10px;">
        <div class="seg-tabs">
          <button class="seg-tab ${ingredientsHistoryTab === 'purchases' ? 'active' : ''}" data-history-tab="purchases">ประวัติซื้อ</button>
          <button class="seg-tab ${ingredientsHistoryTab === 'counts' ? 'active' : ''}" data-history-tab="counts">ประวัตินับสต็อก</button>
        </div>

        <div id="history-panel-purchases" style="${ingredientsHistoryTab === 'purchases' ? '' : 'display:none;'}">
          <p style="font-size:12px;color:var(--ink-soft);margin-top:-6px;">แก้ไข/ลบได้ — ระบบจะคำนวณต้นทุนเฉลี่ยและ COGS ของทุกวันหลังจากนั้นใหม่ให้อัตโนมัติ</p>
          <div style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;font-size:13px;">
              <thead>
                <tr style="text-align:left;color:var(--ink-soft);font-size:12px;">
                  <th style="padding:6px;">วันที่</th>
                  <th style="padding:6px;text-align:right;">จำนวน</th>
                  <th style="padding:6px;text-align:right;">ราคา/หน่วย</th>
                  <th style="padding:6px;text-align:right;"></th>
                </tr>
              </thead>
              <tbody>${lotsRowsHtml}</tbody>
            </table>
          </div>
        </div>

        <div id="history-panel-counts" style="${ingredientsHistoryTab === 'counts' ? '' : 'display:none;'}">
          <p style="font-size:12px;color:var(--ink-soft);margin-top:-6px;">แก้ไข/ลบได้เช่นกัน — รวมถึงแทรกนับย้อนหลังได้ ระบบจะไล่คำนวณวันหลังจากนั้นใหม่ให้</p>
          <div style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;font-size:13px;">
              <thead>
                <tr style="text-align:left;color:var(--ink-soft);font-size:12px;">
                  <th style="padding:6px;">วันที่นับ</th>
                  <th style="padding:6px;text-align:right;">ต้นงวด+รับเข้า</th>
                  <th style="padding:6px;text-align:right;">นับได้</th>
                  <th style="padding:6px;text-align:right;">ใช้ไป</th>
                  <th style="padding:6px;text-align:right;"></th>
                </tr>
              </thead>
              <tbody>${countsRowsHtml}</tbody>
            </table>
          </div>
        </div>
      </div>

      <button class="btn-danger-text" style="margin-top:16px;" data-remove-ingredient="${selectedIng.id}">ลบวัตถุดิบนี้</button>
    </div>`;
  }

  // ---------- ตารางสรุปวัตถุดิบรายวัน (ทุกรายการ ณ วันที่เดียว) ----------
  const ledgerRowsHtml = ledgerRows.length
    ? ledgerRows
        .map((r) => {
          const closingDisplay = r.is_counted ? `${r.closing_count} ${escapeHtml(r.ingredient.unit)}` : `<span style="color:var(--ink-soft);">ยังไม่นับ</span>`;
          const usedDisplay = r.is_counted ? `${r.used_qty} ${escapeHtml(r.ingredient.unit)}` : `<span style="color:var(--ink-soft);">รอปิดร้าน</span>`;
          const valueDisplay = r.is_counted ? formatMoney(r.used_value) : `<span style="color:var(--ink-soft);">—</span>`;
          return `
        <tr>
          <td style="padding:8px;border-bottom:1px solid var(--line);font-weight:700;">${escapeHtml(r.ingredient.name)}</td>
          <td style="padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;">${r.opening_stock} ${escapeHtml(r.ingredient.unit)}</td>
          <td style="padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;">${r.purchased_qty} ${escapeHtml(r.ingredient.unit)}</td>
          <td style="padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;">${closingDisplay}</td>
          <td style="padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;">${usedDisplay}</td>
          <td style="padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;">${valueDisplay}</td>
        </tr>`;
        })
        .join('')
    : `<tr><td colspan="6" style="padding:16px 8px;"><div class="empty-state"><p>ยังไม่มีวัตถุดิบให้แสดง</p></div></td></tr>`;

  const ledgerTotalValue = ledgerRows.reduce((sum, r) => sum + (r.used_value || 0), 0);

  $content.innerHTML = `
    <h1 class="section-title">วัตถุดิบ / สต็อก</h1>

    <div class="card">
      <h2>เพิ่มวัตถุดิบใหม่</h2>
      <div class="field">
        <label for="ing-name">ชื่อวัตถุดิบ</label>
        <input type="text" id="ing-name" placeholder="เช่น ไก่, เส้นก๋วยเตี๋ยว" />
      </div>
      <div class="field-grid">
        <div class="field">
          <label for="ing-unit">หน่วยนับ</label>
          <input type="text" id="ing-unit" placeholder="กก., ขวด, ถุง" />
        </div>
        <div class="field">
          <label for="ing-category">หมวดหมู่</label>
          <input type="text" id="ing-category" list="ing-category-options" placeholder="เลือกหรือพิมพ์หมวดหมู่ใหม่" />
          <datalist id="ing-category-options">
            ${allCategoryOptions.map((c) => `<option value="${escapeHtml(c)}"></option>`).join('')}
          </datalist>
        </div>
      </div>
      <div class="field-grid">
        <div class="field">
          <label for="ing-reorder">จุดสั่งซื้อ (ใกล้หมดเมื่อเหลือน้อยกว่านี้)</label>
          <input type="number" id="ing-reorder" min="0" value="0" />
        </div>
        <div class="field">
          <label for="ing-frequency">ความถี่การนับสต็อก</label>
          <select id="ing-frequency">
            <option value="daily">นับทุกวัน</option>
            <option value="weekly">นับทุกสัปดาห์</option>
          </select>
        </div>
      </div>
      <button class="btn btn-ghost" id="btn-add-ingredient">+ เพิ่มวัตถุดิบ</button>
    </div>

    <div class="alert-row">
      ${
        todayClosed
          ? `<span class="stamp ok">วันนี้ร้านปิด — ไม่ต้องนับสต็อก (เชื่อมกับ "บันทึกวันนี้")</span>`
          : `<span class="stamp ${uncountedToday.length > 0 ? 'warn' : 'ok'}">ยังไม่ได้นับสต็อกวันนี้ ${uncountedToday.length} รายการ</span>`
      }
    </div>

    <div style="margin-bottom:16px;">
      <button class="btn btn-ghost btn-small" id="btn-export-lots">ส่งออกประวัติราคาซื้อทุกล็อต (CSV)</button>
    </div>

    <div class="card">
      <h2>สรุปวัตถุดิบ</h2>
      <div class="seg-tabs">
        <button class="seg-tab ${ingredientsSummaryTab === 'daily' ? 'active' : ''}" data-summary-tab="daily">สรุปรายวัน</button>
        <button class="seg-tab ${ingredientsSummaryTab === 'trend' ? 'active' : ''}" data-summary-tab="trend">แนวโน้มการใช้ (รายตัว)</button>
      </div>

      <div id="summary-panel-daily" style="${ingredientsSummaryTab === 'daily' ? '' : 'display:none;'}">
        <p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;">เลือกวันที่เพื่อดูยอดยกมา/ซื้อเข้า/นับได้ตอนปิดร้าน/ใช้ไปจริงของวัตถุดิบทุกตัว — ดูตอนเช้าเพื่อวางแผนงาน (แถวที่ยังไม่นับจะโชว์ยอดคงเหลือปัจจุบัน) หรือดูสรุปหลังปิดร้านแล้วก็ได้</p>
        <div class="field">
          <label for="ledger-date">วันที่</label>
          <input type="date" id="ledger-date" value="${ingredientsLedgerDate}" max="${today}" />
        </div>
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead>
              <tr style="text-align:left;color:var(--ink-soft);font-size:12px;">
                <th style="padding:8px;">วัตถุดิบ</th>
                <th style="padding:8px;text-align:right;">ยอดยกมา</th>
                <th style="padding:8px;text-align:right;">ซื้อเข้า</th>
                <th style="padding:8px;text-align:right;">นับได้ปิดร้าน</th>
                <th style="padding:8px;text-align:right;">ใช้ไปจริง</th>
                <th style="padding:8px;text-align:right;">มูลค่าที่ใช้ไป</th>
              </tr>
            </thead>
            <tbody>${ledgerRowsHtml}</tbody>
          </table>
        </div>
        <div class="row-item" style="border-top:2px solid var(--line);margin-top:6px;padding-top:10px;border-bottom:none;">
          <span class="label" style="font-weight:700;">รวมมูลค่าที่ใช้ไป (เฉพาะรายการที่นับแล้ว)</span>
          <span class="value" style="font-weight:700;">${formatMoney(ledgerTotalValue)}</span>
        </div>
      </div>

      <div id="summary-panel-trend" style="${ingredientsSummaryTab === 'trend' ? '' : 'display:none;'}">
        <p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;">ดูว่าวัตถุดิบแต่ละอย่างถูกใช้ไปมากน้อยแค่ไหนในแต่ละวัน เพื่อประเมินต้นทุนอาหาร</p>
        <div class="field">
          <label for="usage-ingredient">วัตถุดิบ</label>
          <select id="usage-ingredient">
            ${allIngredients.map((ing) => `<option value="${ing.id}">${escapeHtml(ing.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field-grid">
          <div class="field">
            <label for="usage-from">จากวันที่</label>
            <input type="date" id="usage-from" value="${(() => { const d = new Date(); d.setDate(d.getDate() - 6); return d.toISOString().slice(0, 10); })()}" max="${today}" />
          </div>
          <div class="field">
            <label for="usage-to">ถึงวันที่</label>
            <input type="date" id="usage-to" value="${today}" max="${today}" />
          </div>
        </div>
        <button class="btn btn-ghost btn-small" id="btn-view-usage">ดูสรุป</button>
        <div id="usage-result" style="margin-top:14px;"></div>
      </div>
    </div>

    ${tableHtml}
    ${detailHtml}
  `;

  document.getElementById('btn-add-ingredient').addEventListener('click', async () => {
    const name = document.getElementById('ing-name').value.trim();
    const unit = document.getElementById('ing-unit').value.trim();
    const category = document.getElementById('ing-category').value.trim() || null;
    if (!name || !unit) { showToast('กรุณาใส่ชื่อและหน่วยนับ'); return; }
    try {
      await createIngredient({
        name,
        unit,
        category,
        reorder_point: Number(document.getElementById('ing-reorder').value) || 0,
        count_frequency: document.getElementById('ing-frequency').value,
      });
      showToast('เพิ่มวัตถุดิบสำเร็จ');
      ingredientsActiveCategory = category ? category : 'ไม่ระบุหมวดหมู่';
      renderIngredients(ingredientsDetailId);
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message);
    }
  });

  document.getElementById('btn-export-lots').addEventListener('click', () => {
    exportIngredientPurchaseLotsCsv();
  });

  document.getElementById('ledger-date').addEventListener('change', (e) => {
    ingredientsLedgerDate = e.target.value;
    renderIngredients(ingredientsDetailId);
  });

  document.querySelectorAll('[data-summary-tab]').forEach((btn) => {
    btn.addEventListener('click', () => {
      ingredientsSummaryTab = btn.dataset.summaryTab;
      renderIngredients(ingredientsDetailId);
    });
  });

  document.getElementById('btn-view-usage')?.addEventListener('click', async () => {
    const ingredientId = document.getElementById('usage-ingredient').value;
    const from = document.getElementById('usage-from').value;
    const to = document.getElementById('usage-to').value;
    const ing = ingredients.find((i) => i.id === ingredientId);
    if (!ing) return;

    const report = await getIngredientUsageReport(ingredientId, from, to);
    const rowsHtml = report.records.length
      ? report.records
          .map(
            (r) => `
        <tr>
          <td style="padding:7px 6px;border-bottom:1px solid var(--line);">${r.count_date}</td>
          <td style="padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;">${r.used_qty} ${escapeHtml(ing.unit)}</td>
          <td style="padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;">${formatMoney(r.used_value)}</td>
        </tr>`
          )
          .join('')
      : `<tr><td colspan="3" style="padding:10px 6px;color:var(--ink-soft);">ไม่มีข้อมูลการนับสต็อกในช่วงนี้</td></tr>`;

    document.getElementById('usage-result').innerHTML = `
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead>
            <tr style="text-align:left;color:var(--ink-soft);font-size:12px;">
              <th style="padding:6px;">วันที่นับ</th>
              <th style="padding:6px;text-align:right;">ใช้ไป</th>
              <th style="padding:6px;text-align:right;">มูลค่า</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      <div class="row-item" style="border-bottom:none;margin-top:4px;">
        <span class="label" style="font-weight:700;">รวมทั้งช่วง</span>
        <span class="value">${report.total_used_qty} ${escapeHtml(ing.unit)} (${formatMoney(report.total_used_value)})</span>
      </div>
    `;
  });

  document.querySelectorAll('[data-ingredient-row]').forEach((row) => {
    row.addEventListener('click', () => {
      const id = row.dataset.ingredientRow;
      renderIngredients(ingredientsDetailId === id ? null : id);
    });
  });

  document.querySelectorAll('[data-select-ing-category]').forEach((btn) => {
    btn.addEventListener('click', () => {
      ingredientsActiveCategory = btn.dataset.selectIngCategory;
      renderIngredients(ingredientsDetailId);
    });
  });

  const closeDetailBtn = document.querySelector('[data-close-detail]');
  if (closeDetailBtn) closeDetailBtn.addEventListener('click', () => {
    ingredientsActionTab = 'purchase';
    ingredientsHistoryTab = 'purchases';
    ingredientsHistoryOpen = false;
    renderIngredients(null);
  });

  document.querySelectorAll('[data-action-tab]').forEach((btn) => {
    btn.addEventListener('click', () => {
      ingredientsActionTab = btn.dataset.actionTab;
      renderIngredients(ingredientsDetailId);
    });
  });

  const toggleHistoryBtn = document.getElementById('btn-toggle-ing-history');
  if (toggleHistoryBtn) {
    toggleHistoryBtn.addEventListener('click', () => {
      ingredientsHistoryOpen = !ingredientsHistoryOpen;
      renderIngredients(ingredientsDetailId);
    });
  }

  document.querySelectorAll('[data-history-tab]').forEach((btn) => {
    btn.addEventListener('click', () => {
      ingredientsHistoryTab = btn.dataset.historyTab;
      renderIngredients(ingredientsDetailId);
    });
  });

  const saveCategoryBtn = document.getElementById('btn-save-category');
  if (saveCategoryBtn) {
    saveCategoryBtn.addEventListener('click', async () => {
      const category = document.getElementById('detail-category').value.trim() || null;
      await updateIngredient(ingredientsDetailId, { category });
      showToast('บันทึกหมวดหมู่แล้ว');
      renderIngredients(ingredientsDetailId);
    });
  }

  const removeBtn = document.querySelector('[data-remove-ingredient]');
  if (removeBtn) {
    removeBtn.addEventListener('click', async () => {
      const result = await removeIngredient(removeBtn.dataset.removeIngredient);
      showToast(result.deleted ? 'ลบวัตถุดิบสำเร็จ' : 'ซ่อนวัตถุดิบแล้ว (มีประวัติซื้อ/นับอยู่ ลบจริงไม่ได้)');
      renderIngredients(null);
    });
  }

  const savePurchaseBtn = document.getElementById('btn-detail-save-purchase');
  if (savePurchaseBtn) {
    savePurchaseBtn.addEventListener('click', async () => {
      const qty = Number(document.getElementById('detail-purchase-qty').value) || 0;
      const cost = Number(document.getElementById('detail-purchase-cost').value) || 0;
      const date = document.getElementById('detail-purchase-date').value;
      if (qty <= 0) { showToast('กรุณาใส่จำนวนที่ซื้อ'); return; }
      try {
        await recordPurchase({ ingredient_id: ingredientsDetailId, purchase_date: date, quantity: qty, unit_cost: cost });
        showToast('บันทึกซื้อเข้าสำเร็จ');
        renderIngredients(ingredientsDetailId);
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  }

  const saveCountBtn = document.getElementById('btn-detail-save-count');
  if (saveCountBtn) {
    saveCountBtn.addEventListener('click', async () => {
      const closing = Number(document.getElementById('detail-count-closing').value) || 0;
      const date = document.getElementById('detail-count-date').value;
      try {
        const result = await recordStockCount({ ingredient_id: ingredientsDetailId, count_date: date, closing_count: closing });
        document.getElementById('detail-count-result').textContent =
          `ใช้ไป ${result.used_qty} หน่วย มูลค่า ${formatMoney(result.used_value)}`;
        showToast('บันทึกนับสต็อกสำเร็จ');
        renderIngredients(ingredientsDetailId);
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  }

  document.querySelectorAll('[data-save-purchase]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('tr');
      const purchase_date = row.querySelector('.edit-purchase-date').value;
      const quantity = Number(row.querySelector('.edit-purchase-qty').value);
      const unit_cost = Number(row.querySelector('.edit-purchase-cost').value);
      if (!(quantity > 0) || unit_cost < 0) { showToast('จำนวน/ราคาไม่ถูกต้อง'); return; }
      try {
        await updatePurchase(btn.dataset.savePurchase, { purchase_date, quantity, unit_cost });
        showToast('แก้ไขรายการซื้อแล้ว — คำนวณต้นทุนและ COGS วันหลังจากนี้ใหม่ให้แล้ว');
        renderIngredients(ingredientsDetailId);
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  });

  document.querySelectorAll('[data-remove-purchase]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('ลบรายการซื้อนี้? ระบบจะคำนวณต้นทุนเฉลี่ยและ COGS ของทุกวันหลังจากนี้ใหม่')) return;
      try {
        await removePurchase(btn.dataset.removePurchase);
        showToast('ลบรายการซื้อแล้ว');
        renderIngredients(ingredientsDetailId);
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  });

  document.querySelectorAll('[data-save-count]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('tr');
      const closing_count = Number(row.querySelector('.edit-count-closing').value);
      if (Number.isNaN(closing_count)) { showToast('จำนวนที่นับไม่ถูกต้อง'); return; }
      try {
        await updateStockCount(btn.dataset.saveCount, { closing_count });
        showToast('แก้ไขการนับสต็อกแล้ว — คำนวณ COGS วันหลังจากนี้ใหม่ให้แล้ว');
        renderIngredients(ingredientsDetailId);
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  });

  document.querySelectorAll('[data-remove-count]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('ลบรายการนับสต็อกนี้? ระบบจะคำนวณ COGS ของทุกวันหลังจากนี้ใหม่')) return;
      try {
        await removeStockCount(btn.dataset.removeCount);
        showToast('ลบรายการนับสต็อกแล้ว');
        renderIngredients(ingredientsDetailId);
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  });
}

// ------------------------------------------------------------
// Router
// ------------------------------------------------------------
const views = { dashboard: renderDashboard, entry: () => renderEntry(), menu: renderMenuSettings, more: renderMore, ingredients: () => renderIngredients(null), finance: renderFinance, reports: () => renderReports() };
const navHighlightFor = { reports: 'more' };

async function navigate(viewName) {
  const highlightAs = navHighlightFor[viewName] || viewName;
  $nav.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.view === highlightAs));
  await views[viewName]();
  window.scrollTo(0, 0);
}

$nav.querySelectorAll('button').forEach((btn) => {
  btn.addEventListener('click', () => navigate(btn.dataset.view));
});

// ------------------------------------------------------------
// Service worker registration
// ------------------------------------------------------------
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch((err) => console.warn('SW register failed:', err));
}

// เผื่อ debug ผ่าน browser devtools console (เช่น window.__app.db.daily_entries.toArray())
window.__app = {
  db, getSetting, setSetting, listOverdueStockCounts, recordPurchase, recordStockCount, getHeadcountSummary,
  addFixedCostEntry, getEntryForDate, getCurrentFixedCost, listFixedCostHistory, removeFixedCostEntry, getDailyFixedCost,
  recordGasPurchase, listGasPurchases, getDailyGasCost, removeGasPurchase,
  regenerateSummariesInRange,
  getDailyFixedOverheadBreakdown, getContributionMarginPerHead, getBreakEvenHeadcount,
  changeOperatingExpenseRate,
};

// ------------------------------------------------------------
// Boot
// ------------------------------------------------------------
(async function boot() {
  try {
    await bootstrapDefaults();
    await renderHeader();
    await navigate('dashboard');
  } catch (err) {
    $content.innerHTML = `<div class="card"><p>เกิดข้อผิดพลาดตอนเปิดแอป: ${escapeHtml(err.message)}</p></div>`;
    console.error(err);
  }
})();


</script>
</body>
</html>
