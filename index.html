<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>ตัวตึงก๋วยเตี๋ยวไก่มะระ บุฟเฟต์</title>
<style>
  :root {
    --cream: #F3E9D8;
    --cream-deep: #EADFC8;
    --terracotta: #BC5A34;
    --terracotta-deep: #8F3F22;
    --ink: #2E2117;
    --ink-soft: #6B5C4C;
    --herb: #5C6B41;
    --herb-bg: #E7EADB;
    --line: #D8C4A5;
    --white: #FFFDF9;
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", "Leelawadee UI", "PingFang TC", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    padding-bottom: 84px; /* เผื่อ bottom nav */
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font-family: inherit; font-size: inherit; }

  h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -0.01em; }

  /* ---------------- App bar / ตั๋วสรุปยอด ---------------- */
  .ticket {
    position: relative;
    background: var(--terracotta);
    color: var(--white);
    padding: 20px 20px 28px;
    margin-bottom: 24px;
  }
  .ticket::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px; height: 16px;
    background: radial-gradient(circle at 8px 8px, transparent 8px, var(--cream) 8px) 0 -8px / 16px 16px repeat-x;
  }
  .ticket-eyebrow { font-size: 13px; opacity: 0.85; margin-bottom: 2px; }
  .ticket-date { font-size: 20px; font-weight: 700; margin-bottom: 14px; }
  .ticket-stat-label { font-size: 13px; opacity: 0.85; }
  .ticket-stat-value {
    font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .ticket-stat-value.pending { font-size: 17px; font-weight: 600; opacity: 0.95; }
  .ticket-cta {
    display: inline-block; margin-top: 12px;
    background: var(--white); color: var(--terracotta-deep);
    border: none; border-radius: 999px; padding: 10px 18px;
    font-weight: 700; font-size: 14px; cursor: pointer;
  }

  main { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* ---------------- ป้ายสถานะทรงตราปั๊ม ---------------- */
  .stamp {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1.5px dashed currentColor; border-radius: 999px;
    padding: 5px 12px; font-size: 13px; font-weight: 700;
  }
  .stamp.warn { color: var(--terracotta-deep); background: #F6E3D3; }
  .stamp.ok { color: var(--herb); background: var(--herb-bg); }

  .alert-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

  /* ---------------- การ์ดข้อมูล (ไม่มนเท่ากันทุกใบ ตั้งใจให้ต่างจาก ticket) ---------------- */
  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 16px; margin-bottom: 12px; }
  .card h3 { font-size: 14px; color: var(--ink-soft); margin-bottom: 8px; font-weight: 700; }

  .row-list { display: flex; flex-direction: column; }
  .row-item {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 0; border-bottom: 1px dashed var(--line);
  }
  .row-item:last-child { border-bottom: none; }
  .row-item .label { color: var(--ink-soft); font-size: 14px; }
  .row-item .value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .row-item .value.profit-pos { color: var(--herb); }
  .row-item .value.profit-neg { color: var(--terracotta-deep); }

  .empty-state { text-align: center; padding: 28px 16px; color: var(--ink-soft); }
  .empty-state p { margin: 4px 0; }

  /* ---------------- ฟอร์ม ---------------- */
  label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
  .field { margin-bottom: 14px; }
  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    width: 100%; padding: 11px 12px;
    border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--white); color: var(--ink);
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--terracotta); outline-offset: 1px; border-color: var(--terracotta);
  }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: 10px; padding: 13px 18px;
    font-weight: 700; cursor: pointer; width: 100%;
  }
  .btn-primary { background: var(--terracotta); color: var(--white); }
  .btn-primary:active { background: var(--terracotta-deep); }
  .btn-ghost { background: transparent; color: var(--terracotta-deep); border: 1.5px solid var(--terracotta); }
  .btn-danger-text { background: none; border: none; color: var(--terracotta-deep); font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px; }
  .btn-small { width: auto; padding: 8px 14px; font-size: 14px; }

  .addon-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed var(--line); gap: 12px; }
  .addon-row:last-child { border-bottom: none; }
  .addon-row .name { font-size: 14px; flex: 1; }
  .addon-row input { width: 70px; text-align: center; padding: 8px; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: var(--ink); color: var(--white); padding: 10px 18px;
    border-radius: 999px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    max-width: 90vw; text-align: center; z-index: 50;
  }
  .toast.show { opacity: 1; }

  /* ---------------- Bottom nav ---------------- */
  nav.bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--white); border-top: 1px solid var(--line);
    display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index: 40;
  }
  nav.bottom-nav button {
    flex: 1; background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 2px; color: var(--ink-soft); font-size: 11px; font-weight: 700;
    border-radius: 10px;
  }
  nav.bottom-nav button.active { color: var(--terracotta-deep); background: var(--cream-deep); }
  nav.bottom-nav svg { width: 22px; height: 22px; }

  .section-title { font-size: 20px; font-weight: 800; margin: 4px 0 16px; }

  a { color: var(--terracotta-deep); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<body>

<div id="app-header"></div>
<main id="app-content"></main>

<div class="toast" id="toast"></div>

<nav class="bottom-nav" id="bottom-nav">
  <button data-view="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>

  <button data-view="menu">

  </button>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
    เพิ่มเติม
  </button>

<script type="module">
import Dexie from 'https://cdn.jsdelivr.net/npm/dexie@4/+esm';

// ============================================================
// db.js (embedded)
// ============================================================
// db.js
// นิยามโครงสร้างฐานข้อมูล IndexedDB (ผ่าน Dexie.js) สำหรับระบบหลังบ้าน
// "ตัวตึงก๋วยเตี๋ยวไก่มะระ บุฟเฟต์"
//
// อ้างอิงจาก:
//   - database-design-tuadueng.md (v1 draft) หมวด 2-6
//   - SCHEMA_ADDENDUM_daily-entry.md (แทนที่ orders/order_items/order_buffet_details/order_edit_logs
//     ด้วย daily_entries/daily_addon_sales/daily_entry_edit_logs)
//
// ทุกตารางหลักใช้ UUID (string) เป็น Primary Key ตามที่ตกลงไว้ในเอกสารข้อ 7
// (รองรับ export/import ย้ายเครื่องโดยไม่ชน id กัน)


const db = new Dexie('tuadueng_db');

// หมายเหตุ Dexie schema syntax:
//   - 'id' (ไม่มี ++) = primary key ที่แอปเป็นคนกำหนดเอง (เราใช้ UUID)
//   - '&field' = unique index
//   - '[a+b]' = compound index (ใช้เช็ค unique constraint คู่ฟิลด์)
db.version(1).stores({
  // ---------- 1) Master data ----------
  system_settings: 'id, &key',
  buffet_packages: 'id, name, is_active',
  menu_categories: 'id, name, is_active',
  menu_items: 'id, category_id, item_type, is_active',
  shifts: 'id, name',

  // ---------- 2) Daily Entry (แทน orders เดิม ตาม SCHEMA_ADDENDUM) ----------
  daily_entries: 'id, &entry_date, recorded_by',
  daily_addon_sales: 'id, entry_date, menu_item_id, [entry_date+menu_item_id]',
  daily_entry_edit_logs: 'id, entry_date, changed_at',

  // ---------- 3) วัตถุดิบ/สต็อก ----------
  ingredients: 'id, name, category, is_active, count_frequency',
  ingredient_purchases: 'id, ingredient_id, purchase_date',
  ingredient_stock_counts: 'id, ingredient_id, count_date, [ingredient_id+count_date]',
  menu_item_ingredients: 'id, menu_item_id, ingredient_id, [menu_item_id+ingredient_id]',
  cost_references: 'id, target_type, target_id, [target_type+target_id]',

  // ---------- 4) การเงิน ----------
  operating_expenses: 'id, name, is_active, frequency',
  expense_payments: 'id, operating_expense_id, payment_date, category',

  // ---------- 5) สรุปผล ----------
  daily_summary: 'id, &summary_date, data_source',

  // ---------- 6) Export/Import metadata ----------
  system_meta: 'id, &key',
});



// ============================================================
// repository.js (embedded)
// ============================================================
// repository.js
// ฟังก์ชันหลักที่ห่อ business logic ของระบบ "ตัวตึงก๋วยเตี๋ยวไก่มะระ บุฟเฟต์"
// อ้างอิง SCHEMA_ADDENDUM_daily-entry.md (v1 หลังปรับเป็น daily aggregate entry)


// ---------------------------------------------------------------------------
// Utilities
// ---------------------------------------------------------------------------

function uuid() {
  if (typeof globalThis.crypto?.randomUUID === 'function') {
    return globalThis.crypto.randomUUID();
  }
  // fallback UUIDv4 (เผื่อ environment ไม่มี crypto.randomUUID)
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    const v = c === 'x' ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

function nowIso() {
  return new Date().toISOString();
}

async function getSetting(key, fallback = null) {
  const row = await db.system_settings.where('key').equals(key).first();
  return row ? row.value : fallback;
}

async function setSetting(key, value) {
  const existing = await db.system_settings.where('key').equals(key).first();
  const record = { id: existing ? existing.id : uuid(), key, value: String(value), updated_at: nowIso() };
  await db.system_settings.put(record);
  return record;
}

// ---------------------------------------------------------------------------
// 1) Daily Entries (แทน orders เดิม)
// ---------------------------------------------------------------------------

/**
 * สร้างหรืออัปเดต daily_entries ของวันที่ระบุ พร้อม snapshot ราคาบุฟเฟต์ปัจจุบัน
 * และบันทึก before/after ลง daily_entry_edit_logs โดยอัตโนมัติ
 *
 * @param {object} input
 *   entry_date (string 'YYYY-MM-DD', required)
 *   buffet_adult_count, buffet_child_count (int)
 *   ala_carte_total, takeaway_total (decimal)
 *   takeaway_count (int) — ใช้คำนวณค่าถุงอัตโนมัติตอนสร้าง daily_summary
 *   note (string, optional)
 *   recorded_by (shift_id)
 *   adult_package_name / child_package_name — ชื่อ buffet_packages ที่จะดึงราคามา snapshot
 *       (default: "ผู้ใหญ่" / "เด็ก")
 */
async function upsertDailyEntry(input) {
  const {
    entry_date,
    buffet_adult_count = 0,
    buffet_child_count = 0,
    ala_carte_total = 0,
    takeaway_total = 0,
    takeaway_count = 0,
    note = null,
    recorded_by = null,
    adult_package_name = 'ผู้ใหญ่',
    child_package_name = 'เด็ก',
  } = input;

  if (!entry_date) throw new Error('entry_date is required');

  return db.transaction(
    'rw',
    db.daily_entries,
    db.daily_addon_sales,
    db.daily_entry_edit_logs,
    db.buffet_packages,
    async () => {
      const existing = await db.daily_entries.where('entry_date').equals(entry_date).first();

      // ราคาบุฟเฟต์ — snapshot ไว้ตายตัว "ครั้งแรกที่สร้าง entry เท่านั้น"
      // ถ้าเป็นการแก้ไข (edit) ของวันเดิม ต้องคง snapshot เดิมไว้ ห้ามดึงราคาปัจจุบันมาทับ
      // (มิฉะนั้นแก้ไขจำนวนหัวย้อนหลังหลังราคาขึ้น จะทำให้วันเก่าถูกคิดราคาใหม่ผิดหลักการ snapshot)
      let buffet_adult_price_snapshot = existing?.buffet_adult_price_snapshot;
      let buffet_child_price_snapshot = existing?.buffet_child_price_snapshot;

      if (!existing) {
        const adultPkg = await db.buffet_packages.where('name').equals(adult_package_name).first();
        const childPkg = await db.buffet_packages.where('name').equals(child_package_name).first();
        buffet_adult_price_snapshot = adultPkg ? adultPkg.price : 0;
        buffet_child_price_snapshot = childPkg ? childPkg.price : 0;
      }
      // อนุญาตให้ override snapshot ได้แบบ explicit เท่านั้น (เช่น แก้ราคาที่กรอกผิดจริงๆ)
      if (input.adult_price_snapshot !== undefined) buffet_adult_price_snapshot = input.adult_price_snapshot;
      if (input.child_price_snapshot !== undefined) buffet_child_price_snapshot = input.child_price_snapshot;

      const before_snapshot = existing ? await buildDailySnapshot(entry_date) : null;

      const record = {
        id: existing ? existing.id : uuid(),
        entry_date,
        buffet_adult_count,
        buffet_adult_price_snapshot,
        buffet_child_count,
        buffet_child_price_snapshot,
        ala_carte_total,
        takeaway_total,
        takeaway_count,
        note,
        recorded_by,
        created_at: existing ? existing.created_at : nowIso(),
        updated_at: nowIso(),
      };

      await db.daily_entries.put(record);

      const after_snapshot = await buildDailySnapshot(entry_date);

      await db.daily_entry_edit_logs.add({
        id: uuid(),
        entry_date,
        action: existing ? 'edit' : 'create',
        changed_at: nowIso(),
        changed_by: recorded_by,
        before_snapshot,
        after_snapshot,
        reason: null,
      });

      return record;
    }
  ).then(async (record) => {
    await generateDailySummary(entry_date);
    return record;
  });
}

/**
 * บันทึก/แก้ไขจำนวนที่ขายของเมนู addon (น้ำ/ขนม) ในวันที่ระบุ
 * ใช้ semantics แบบ "set" (กำหนด quantity ใหม่ทับของเดิม) ไม่ใช่บวกเพิ่ม
 */
async function recordAddonSale({ entry_date, menu_item_id, quantity, recorded_by = null }) {
  if (!entry_date || !menu_item_id) throw new Error('entry_date and menu_item_id are required');

  const entry = await db.daily_entries.where('entry_date').equals(entry_date).first();
  if (!entry) {
    throw new Error(`ต้องสร้าง daily_entries ของวันที่ ${entry_date} ก่อน จึงจะบันทึกยอดขาย addon ได้`);
  }

  const menuItem = await db.menu_items.get(menu_item_id);
  if (!menuItem) throw new Error(`ไม่พบ menu_item_id: ${menu_item_id}`);
  if (menuItem.item_type !== 'addon') {
    throw new Error(`menu_item "${menuItem.name}" ไม่ใช่ item_type='addon'`);
  }

  return db.transaction('rw', db.daily_entries, db.daily_addon_sales, db.daily_entry_edit_logs, async () => {
    const before_snapshot = await buildDailySnapshot(entry_date);

    const existingRow = await db.daily_addon_sales
      .where('[entry_date+menu_item_id]')
      .equals([entry_date, menu_item_id])
      .first();

    const unit_price_snapshot = menuItem.default_price;
    const subtotal = quantity * unit_price_snapshot;

    const record = {
      id: existingRow ? existingRow.id : uuid(),
      entry_date,
      menu_item_id,
      quantity,
      unit_price_snapshot,
      subtotal,
    };
    await db.daily_addon_sales.put(record);

    const after_snapshot = await buildDailySnapshot(entry_date);

    await db.daily_entry_edit_logs.add({
      id: uuid(),
      entry_date,
      action: existingRow ? 'edit' : 'create',
      changed_at: nowIso(),
      changed_by: recorded_by,
      before_snapshot,
      after_snapshot,
      reason: `addon sale: ${menuItem.name}`,
    });

    return record;
  }).then(async (record) => {
    await generateDailySummary(entry_date);
    return record;
  });
}

async function buildDailySnapshot(entry_date) {
  const entry = await db.daily_entries.where('entry_date').equals(entry_date).first();
  const addons = await db.daily_addon_sales.where('entry_date').equals(entry_date).toArray();
  return { entry: entry ?? null, addons };
}

// ---------------------------------------------------------------------------
// 2) วัตถุดิบ — ซื้อเข้า (Weighted Average Cost)
// ---------------------------------------------------------------------------

async function recordPurchase({ ingredient_id, purchase_date, quantity, unit_cost, recorded_by = null }) {
  return db.transaction('rw', db.ingredients, db.ingredient_purchases, async () => {
    const ingredient = await db.ingredients.get(ingredient_id);
    if (!ingredient) throw new Error(`ไม่พบ ingredient_id: ${ingredient_id}`);

    const stock_before = ingredient.current_stock || 0;
    const avg_cost_before = ingredient.current_avg_cost || 0;
    const total_cost = quantity * unit_cost;
    const stock_after = stock_before + quantity;
    const avg_cost_after =
      stock_after > 0 ? (stock_before * avg_cost_before + quantity * unit_cost) / stock_after : unit_cost;

    const record = {
      id: uuid(),
      ingredient_id,
      purchase_date,
      quantity,
      unit_cost,
      total_cost,
      stock_before,
      avg_cost_before,
      avg_cost_after,
      recorded_by,
      created_at: nowIso(),
    };
    await db.ingredient_purchases.add(record);

    await db.ingredients.update(ingredient_id, {
      current_stock: stock_after,
      current_avg_cost: avg_cost_after,
    });

    return record;
  });
}

/**
 * แก้ไข/ลบรายการซื้อเก่า ต้อง cascade recalculate ทุกรายการที่เกิดหลังจากนั้น
 * (ตามคำเตือนในเอกสารข้อ 4 — ingredient_purchases)
 * v1 note: recalculate เฉพาะ chain ของ ingredient_purchases เท่านั้น
 * ยังไม่รวม interleave กับ ingredient_stock_counts ในการคำนวณ current_stock แบบละเอียด
 */
async function recalculatePurchaseChain(ingredient_id) {
  return db.transaction('rw', db.ingredients, db.ingredient_purchases, async () => {
    const purchases = await db.ingredient_purchases
      .where('ingredient_id')
      .equals(ingredient_id)
      .sortBy('purchase_date');

    let runningStock = 0;
    let runningAvgCost = 0;

    for (const p of purchases) {
      const stock_before = runningStock;
      const avg_cost_before = runningAvgCost;
      const stock_after = stock_before + p.quantity;
      const avg_cost_after =
        stock_after > 0 ? (stock_before * avg_cost_before + p.quantity * p.unit_cost) / stock_after : p.unit_cost;

      await db.ingredient_purchases.update(p.id, {
        stock_before,
        avg_cost_before,
        avg_cost_after,
        total_cost: p.quantity * p.unit_cost,
      });

      runningStock = stock_after;
      runningAvgCost = avg_cost_after;
    }

    await db.ingredients.update(ingredient_id, {
      current_stock: runningStock,
      current_avg_cost: runningAvgCost,
    });

    return { current_stock: runningStock, current_avg_cost: runningAvgCost };
  });
}

// ---------------------------------------------------------------------------
// 3) วัตถุดิบ — นับสต็อกปิดร้าน (ตัวกำหนด COGS จริง)
// ---------------------------------------------------------------------------

async function recordStockCount({ ingredient_id, count_date, closing_count, recorded_by = null }) {
  return db.transaction(
    'rw',
    db.ingredients,
    db.ingredient_purchases,
    db.ingredient_stock_counts,
    async () => {
      const ingredient = await db.ingredients.get(ingredient_id);
      if (!ingredient) throw new Error(`ไม่พบ ingredient_id: ${ingredient_id}`);

      const priorCounts = await db.ingredient_stock_counts
        .where('ingredient_id')
        .equals(ingredient_id)
        .and((c) => c.count_date < count_date)
        .sortBy('count_date');
      const lastCount = priorCounts.length ? priorCounts[priorCounts.length - 1] : null;

      const opening_stock = lastCount ? lastCount.closing_count : 0;
      const rangeStart = lastCount ? lastCount.count_date : null;

      const purchasesInRange = await db.ingredient_purchases
        .where('ingredient_id')
        .equals(ingredient_id)
        .and((p) => (rangeStart === null || p.purchase_date > rangeStart) && p.purchase_date <= count_date)
        .toArray();
      const purchased_qty = purchasesInRange.reduce((sum, p) => sum + p.quantity, 0);

      const used_qty = opening_stock + purchased_qty - closing_count;

      // avg cost ล่าสุด ณ วันนับ (ใช้ purchase ล่าสุดที่ <= count_date, fallback = current_avg_cost)
      const purchasesUpToDate = await db.ingredient_purchases
        .where('ingredient_id')
        .equals(ingredient_id)
        .and((p) => p.purchase_date <= count_date)
        .sortBy('purchase_date');
      const avgCostAtCount =
        purchasesUpToDate.length > 0
          ? purchasesUpToDate[purchasesUpToDate.length - 1].avg_cost_after
          : ingredient.current_avg_cost || 0;

      const used_value = used_qty * avgCostAtCount;

      const record = {
        id: uuid(),
        ingredient_id,
        count_date,
        opening_stock,
        purchased_qty,
        closing_count,
        used_qty,
        used_value,
        recorded_by,
        created_at: nowIso(),
      };

      // unique (ingredient_id, count_date) — ถ้ามีอยู่แล้วให้ทับ (put)
      const existing = await db.ingredient_stock_counts
        .where('[ingredient_id+count_date]')
        .equals([ingredient_id, count_date])
        .first();
      if (existing) record.id = existing.id;

      await db.ingredient_stock_counts.put(record);

      // cache current_stock อัปเดตเป็นยอดนับจริงล่าสุด
      await db.ingredients.update(ingredient_id, { current_stock: closing_count });

      return record;
    }
  );
}

// ---------------------------------------------------------------------------
// 4) Daily Summary — background recalculation
// ---------------------------------------------------------------------------

async function generateDailySummary(summary_date) {
  const entry = await db.daily_entries.where('entry_date').equals(summary_date).first();

  // ไม่มี daily_entries = วันแบบ estimated (กรอกมือ) → ไม่แตะ ปล่อยให้ผู้ใช้กรอกเอง
  if (!entry) return null;

  const addons = await db.daily_addon_sales.where('entry_date').equals(summary_date).toArray();
  const sales_addon = addons.reduce((sum, a) => sum + a.subtotal, 0);

  const sales_buffet =
    entry.buffet_adult_count * entry.buffet_adult_price_snapshot +
    entry.buffet_child_count * entry.buffet_child_price_snapshot;
  const sales_ala_carte = entry.ala_carte_total;
  const sales_takeaway = entry.takeaway_total;

  // COGS = รวม used_value ของวัตถุดิบที่นับสต็อก "ตรงวันนี้พอดี"
  const stockCounts = await db.ingredient_stock_counts.where('count_date').equals(summary_date).toArray();
  const cogs = stockCounts.reduce((sum, c) => sum + c.used_value, 0);

  // ค่าถุง/ยางรัด (packaging) — คำนวณอัตโนมัติจาก default_packaging_fee × takeaway_count
  const packagingFee = Number(await getSetting('default_packaging_fee', 0));
  const packaging_cost = packagingFee * (entry.takeaway_count || 0);

  // ค่าใช้จ่ายประจำแบบ accrual (เฉลี่ย/วัน) จาก operating_expenses ที่ active ณ วันนี้
  const activeExpenses = (await db.operating_expenses.toArray()).filter((e) => {
    if (!e.is_active) return false;
    if (e.start_date && e.start_date > summary_date) return false;
    if (e.end_date && e.end_date < summary_date) return false;
    return true;
  });
  const operating_expense = activeExpenses.reduce((sum, e) => {
    const divisor = e.frequency === 'weekly' ? 7 : 30;
    return sum + e.amount / divisor;
  }, 0);

  const net_profit =
    sales_buffet + sales_ala_carte + sales_takeaway + sales_addon - cogs - packaging_cost - operating_expense;

  const record = {
    id: uuid(),
    summary_date,
    data_source: 'transactional',
    sales_buffet,
    sales_ala_carte,
    sales_takeaway,
    sales_addon,
    cogs,
    packaging_cost,
    operating_expense,
    net_profit,
    note: null,
    updated_at: nowIso(),
  };

  const existing = await db.daily_summary.where('summary_date').equals(summary_date).first();
  if (existing) record.id = existing.id;

  await db.daily_summary.put(record);
  return record;
}

/**
 * บันทึกวันแบบ estimated (ก่อนเปิดระบบ/ข้อมูลไม่ครบ) — กรอกยอดรวมตรงๆ ไม่ผ่าน daily_entries
 * ฟังก์ชันนี้จะไม่ถูก generateDailySummary() เขียนทับ เพราะไม่มี daily_entries รองรับ
 */
async function upsertEstimatedDailySummary({ summary_date, sales_buffet = 0, sales_ala_carte = 0, sales_takeaway = 0, sales_addon = 0, cogs = 0, packaging_cost = 0, operating_expense = 0, note = null }) {
  const net_profit = sales_buffet + sales_ala_carte + sales_takeaway + sales_addon - cogs - packaging_cost - operating_expense;
  const existing = await db.daily_summary.where('summary_date').equals(summary_date).first();
  const record = {
    id: existing ? existing.id : uuid(),
    summary_date,
    data_source: 'estimated',
    sales_buffet,
    sales_ala_carte,
    sales_takeaway,
    sales_addon,
    cogs,
    packaging_cost,
    operating_expense,
    net_profit,
    note,
    updated_at: nowIso(),
  };
  await db.daily_summary.put(record);
  return record;
}

/** อ่านรายงานแบบเลือกช่วงวันที่ (from–to) สำหรับกราฟ/รายงาน */

/** เช็ควัตถุดิบที่ "เกินกำหนดนับสต็อกแล้ว" ณ วันที่ระบุ (default = วันนี้)
 *  daily  -> ต้องมี record ของ checkDate พอดี ไม่งั้นถือว่ายังไม่ได้นับวันนี้
 *  weekly -> ถ้าห่างจากครั้งล่าสุด >= 7 วัน ถือว่าเกินกำหนด (หรือไม่เคยนับเลย) */
async function listOverdueStockCounts(checkDate = new Date().toISOString().slice(0, 10)) {
  const ingredients = (await db.ingredients.toArray()).filter((i) => i.is_active);
  const overdue = [];

  for (const ing of ingredients) {
    const counts = await db.ingredient_stock_counts.where('ingredient_id').equals(ing.id).sortBy('count_date');
    const lastCount = counts.length ? counts[counts.length - 1] : null;

    if (ing.count_frequency === 'daily') {
      const countedToday = counts.some((c) => c.count_date === checkDate);
      if (!countedToday) overdue.push({ ingredient: ing, reason: 'ยังไม่ได้นับวันนี้', last_count_date: lastCount?.count_date ?? null });
    } else if (ing.count_frequency === 'weekly') {
      if (!lastCount) {
        overdue.push({ ingredient: ing, reason: 'ยังไม่เคยนับเลย', last_count_date: null });
      } else {
        const daysSince = Math.round((new Date(checkDate) - new Date(lastCount.count_date)) / 86400000);
        if (daysSince >= 7) {
          overdue.push({ ingredient: ing, reason: `เกินกำหนดนับแล้ว ${daysSince} วัน`, last_count_date: lastCount.count_date });
        }
      }
    }
  }
  return overdue;
}

// ---------------------------------------------------------------------------

// ไม่ได้ใช้คำนวณต้นทุนจริงเป็นสูตรตายตัว เพราะร้านไม่มีสูตรที่แน่นอน (ดู database-design-tuadueng.md)

async function linkMenuItemIngredient({ menu_item_id, ingredient_id, note = null }) {
  const menuItem = await db.menu_items.get(menu_item_id);
  if (!menuItem) throw new Error(`ไม่พบ menu_item_id: ${menu_item_id}`);
  const ingredient = await db.ingredients.get(ingredient_id);
  if (!ingredient) throw new Error(`ไม่พบ ingredient_id: ${ingredient_id}`);

  const existing = await db.menu_item_ingredients
    .where('[menu_item_id+ingredient_id]')
    .equals([menu_item_id, ingredient_id])
    .first();
  if (existing) {
    await db.menu_item_ingredients.update(existing.id, { note });
    return db.menu_item_ingredients.get(existing.id);
  }

  const record = { id: uuid(), menu_item_id, ingredient_id, note };
  await db.menu_item_ingredients.add(record);
  return record;
}

async function unlinkMenuItemIngredient(menu_item_id, ingredient_id) {
  const existing = await db.menu_item_ingredients
    .where('[menu_item_id+ingredient_id]')
    .equals([menu_item_id, ingredient_id])
    .first();
  if (!existing) return { deleted: false, reason: 'ไม่พบความเชื่อมโยงนี้อยู่แล้ว' };
  await db.menu_item_ingredients.delete(existing.id);
  return { deleted: true };
}

async function listIngredientsForMenuItem(menu_item_id) {
  const links = await db.menu_item_ingredients.where('menu_item_id').equals(menu_item_id).toArray();
  const ingredients = await Promise.all(links.map((l) => db.ingredients.get(l.ingredient_id)));

/** ใช้ตอบคำถาม "วัตถุดิบนี้ใกล้หมด จะกระทบเมนูอะไรบ้าง" สำหรับหน้าแจ้งเตือน */
async function listMenuItemsUsingIngredient(ingredient_id) {
  const links = await db.menu_item_ingredients.where('ingredient_id').equals(ingredient_id).toArray();
  const menuItems = await Promise.all(links.map((l) => db.menu_items.get(l.menu_item_id)));
  return menuItems.filter(Boolean);
}

// ---------------------------------------------------------------------------
// 5d) cost_references — ต้นทุนอ้างอิง (กรอกมือ ไม่ใช่คำนวณอัตโนมัติ)
// ---------------------------------------------------------------------------

/** สร้าง/แก้ไขต้นทุนอ้างอิงของ buffet_package หรือ menu_item (upsert ตาม target_type+target_id) */
async function upsertCostReference({ target_type, target_id, estimated_cost, note = null }) {
  if (!['buffet_package', 'menu_item'].includes(target_type)) {
    throw new Error(`target_type ต้องเป็น 'buffet_package' หรือ 'menu_item' เท่านั้น (ได้ '${target_type}')`);
  }
  const targetTable = target_type === 'buffet_package' ? db.buffet_packages : db.menu_items;
  const target = await targetTable.get(target_id);
  if (!target) throw new Error(`ไม่พบ ${target_type} id: ${target_id}`);

  const existing = await db.cost_references.where('[target_type+target_id]').equals([target_type, target_id]).first();
  const record = {
    id: existing ? existing.id : uuid(),
    target_type,
    target_id,
    estimated_cost,
    note,
    updated_at: nowIso(),
  };
  await db.cost_references.put(record);
  return record;
}

async function getCostReference(target_type, target_id) {
  return db.cost_references.where('[target_type+target_id]').equals([target_type, target_id]).first();
}

async function listCostReferences({ target_type = null } = {}) {
  const all = await db.cost_references.toArray();
  return target_type ? all.filter((c) => c.target_type === target_type) : all;
}

async function removeCostReference(target_type, target_id) {
  const existing = await db.cost_references.where('[target_type+target_id]').equals([target_type, target_id]).first();
  if (!existing) return { deleted: false, reason: 'ไม่พบต้นทุนอ้างอิงนี้อยู่แล้ว' };
  await db.cost_references.delete(existing.id);
  return { deleted: true };
}

// ---------------------------------------------------------------------------
// 7) Reporting — query แบบสรุป/จัดกลุ่ม สำหรับหน้ารายงาน
// ---------------------------------------------------------------------------

/** สรุปยอดรวมทั้งช่วง (การ์ดตัวเลขบนหน้ารายงาน) — รวม transactional + estimated ปนกัน */
async function getSalesReport(fromDate, toDate) {
  const rows = await getDailySummaryRange(fromDate, toDate);

  const totals = rows.reduce(
    (acc, r) => {
      acc.sales_buffet += r.sales_buffet || 0;
      acc.sales_ala_carte += r.sales_ala_carte || 0;
      acc.sales_takeaway += r.sales_takeaway || 0;
      acc.sales_addon += r.sales_addon || 0;
      acc.cogs += r.cogs || 0;
      acc.packaging_cost += r.packaging_cost || 0;
      acc.operating_expense += r.operating_expense || 0;
      acc.net_profit += r.net_profit || 0;
      return acc;
    },
    { sales_buffet: 0, sales_ala_carte: 0, sales_takeaway: 0, sales_addon: 0, cogs: 0, packaging_cost: 0, operating_expense: 0, net_profit: 0 }
  );
  totals.total_revenue = totals.sales_buffet + totals.sales_ala_carte + totals.sales_takeaway + totals.sales_addon;

  const days_count = rows.length;
  const averages = {};
  for (const key of Object.keys(totals)) {
    averages[key] = days_count > 0 ? totals[key] / days_count : 0;
  }

  const by_data_source = rows.reduce((acc, r) => {
    acc[r.data_source] = (acc[r.data_source] || 0) + 1;
    return acc;
  }, {});

  return { from: fromDate, to: toDate, days_count, totals, averages, by_data_source };
}

/** จัดกลุ่มยอดรายเดือน (YYYY-MM) สำหรับกราฟ/รายงานช่วงยาว */
async function getMonthlyBreakdown(fromDate, toDate) {
  const rows = await getDailySummaryRange(fromDate, toDate);
  const byMonth = {};

  for (const r of rows) {
    const month = r.summary_date.slice(0, 7); // 'YYYY-MM'
    if (!byMonth[month]) {
      byMonth[month] = {
        month,
        days_count: 0,
        sales_buffet: 0,
        sales_ala_carte: 0,
        sales_takeaway: 0,
        sales_addon: 0,
        cogs: 0,
        packaging_cost: 0,
        operating_expense: 0,
        net_profit: 0,
      };
    }
    const m = byMonth[month];
    m.days_count += 1;
    m.sales_buffet += r.sales_buffet || 0;
    m.sales_ala_carte += r.sales_ala_carte || 0;
    m.sales_takeaway += r.sales_takeaway || 0;
    m.sales_addon += r.sales_addon || 0;
    m.cogs += r.cogs || 0;
    m.packaging_cost += r.packaging_cost || 0;
    m.operating_expense += r.operating_expense || 0;
    m.net_profit += r.net_profit || 0;
  }

  return Object.values(byMonth).sort((a, b) => a.month.localeCompare(b.month));
}

/** เมนูขายดี (น้ำ/ขนม) ในช่วงวันที่ระบุ เรียงจากขายมากไปน้อย */
async function getTopSellingAddons(fromDate, toDate, limit = 10) {
  const rows = await db.daily_addon_sales.where('entry_date').between(fromDate, toDate, true, true).toArray();

  const byMenuItem = {};
  for (const r of rows) {
    if (!byMenuItem[r.menu_item_id]) {
      byMenuItem[r.menu_item_id] = { menu_item_id: r.menu_item_id, total_quantity: 0, total_revenue: 0 };
    }
    byMenuItem[r.menu_item_id].total_quantity += r.quantity;
    byMenuItem[r.menu_item_id].total_revenue += r.subtotal;
  }

  const results = await Promise.all(
    Object.values(byMenuItem).map(async (item) => {
      const menuItem = await db.menu_items.get(item.menu_item_id);
      return { ...item, name: menuItem ? menuItem.name : '(เมนูถูกลบแล้ว)' };
    })
  );

  return results.sort((a, b) => b.total_quantity - a.total_quantity).slice(0, limit);
}

/** สรุปยอดจ่ายจริง (cash) แยกตามหมวด category ในช่วงวันที่ระบุ */
async function getExpenseBreakdown(fromDate, toDate) {
  const rows = await getExpensePaymentsRange(fromDate, toDate);
  const byCategory = {};
  for (const r of rows) {
    byCategory[r.category] = (byCategory[r.category] || 0) + r.amount;
  }
  return Object.entries(byCategory)
    .map(([category, total_amount]) => ({ category, total_amount }))
    .sort((a, b) => b.total_amount - a.total_amount);
}

/** สรุปการใช้วัตถุดิบ (จากการนับสต็อก) ของ ingredient เดียว ในช่วงวันที่ระบุ */
async function getIngredientUsageReport(ingredient_id, fromDate, toDate) {
  const records = await db.ingredient_stock_counts
    .where('ingredient_id')
    .equals(ingredient_id)
    .and((c) => c.count_date >= fromDate && c.count_date <= toDate)
    .sortBy('count_date');

  const total_used_qty = records.reduce((sum, r) => sum + r.used_qty, 0);
  const total_used_value = records.reduce((sum, r) => sum + r.used_value, 0);

  return { ingredient_id, from: fromDate, to: toDate, total_used_qty, total_used_value, records };
}

// ---------------------------------------------------------------------------
// 8) Export / Import (ย้ายเครื่อง)
// ---------------------------------------------------------------------------

async function exportAllData() {
  const dump = {};
  for (const table of db.tables) {
    dump[table.name] = await table.toArray();
  }
  return {
    db_version: db.verno,
    exported_at: nowIso(),
    tables: dump,
  };
}

async function importAllData(payload) {
  const { tables } = payload;
  return db.transaction('rw', db.tables, async () => {
    for (const table of db.tables) {
      await table.clear();
      const rows = tables[table.name];
      if (rows && rows.length) {
        await table.bulkAdd(rows);
      }
    }
  });
}

function showToast(msg) {

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function formatMoney(n) {
  const num = Number(n) || 0;
  return num.toLocaleString('th-TH', { maximumFractionDigits: 0 }) + ' บาท';
}

function formatDateThai(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('th-TH', { weekday: 'short', year: 'numeric', month: 'long', day: 'numeric' });
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

          <label for="f-item-category">หมวดหมู่</label>
          <select id="f-item-category">${categoryOptions}</select>
        </div>
      </div>
      <div class="field">
        <label for="f-item-type">ประเภท</label>
        <select id="f-item-type">
          <option value="addon">น้ำ/ขนม (นับจำนวนขายรายวัน)</option>
          <option value="dish">จานเดี่ยว (รวมในยอดแยกจาน)</option>
        </select>
      </div>
      <button class="btn btn-ghost" id="btn-add-item">+ เพิ่มเมนู</button>
    </div>
  `;

  document.getElementById('btn-save-prices').addEventListener('click', async () => {
    try {
      if (adultPkg) await updateBuffetPackage(adultPkg.id, { price: Number(document.getElementById('f-adult-price').value) || 0 });
      if (childPkg) await updateBuffetPackage(childPkg.id, { price: Number(document.getElementById('f-child-price').value) || 0 });
      await setSetting('default_packaging_fee', Number(document.getElementById('f-packaging-fee').value) || 0);
      showToast('บันทึกราคาสำเร็จ');
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message);
    }
  });

  document.getElementById('btn-add-item').addEventListener('click', async () => {
    const name = document.getElementById('f-item-name').value.trim();
    if (!name) { showToast('กรุณาใส่ชื่อเมนู'); return; }
    try {
      await createMenuItem({
        category_id: document.getElementById('f-item-category').value,
        name,
        default_price: Number(document.getElementById('f-item-price').value) || 0,
        item_type: document.getElementById('f-item-type').value,
      });
      showToast('เพิ่มเมนูสำเร็จ');
      renderMenuSettings();
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message);
    }
  });

  document.querySelectorAll('[data-remove-item]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const result = await removeMenuItem(btn.dataset.removeItem);
      showToast(result.deleted ? 'ลบเมนูสำเร็จ' : 'ซ่อนเมนูแล้ว (เคยมีประวัติขายอยู่ ลบจริงไม่ได้)');
      renderMenuSettings();
    });
  });
}

// ------------------------------------------------------------
// View: เพิ่มเติม (placeholder — โมดูลถัดไป)
// ------------------------------------------------------------
async function renderMore() {
  $content.innerHTML = `
    <h1 class="section-title">เพิ่มเติม</h1>
    <div class="card">
      <div class="row-list">
        <div class="row-item" style="cursor:pointer;" data-goto-sub="ingredients">
          <span class="label" style="font-weight:700;color:var(--ink);">วัตถุดิบ / สต็อก</span>
          <span class="value" style="color:var(--terracotta-deep);">เปิด →</span>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="empty-state">
        <p>การเงิน / รายงาน</p>
        <p>กำลังจะมาในเวอร์ชันถัดไป</p>
      </div>
    </div>
    <div class="card">
      <h2>สำรองข้อมูล</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;">ย้ายข้อมูลทั้งหมดไปเครื่องอื่น หรือสำรองไว้กันข้อมูลหาย</p>
      <button class="btn btn-ghost" id="btn-export" style="margin-bottom:10px;">ดาวน์โหลดไฟล์สำรองข้อมูล</button>
      <label for="import-file" class="btn btn-primary" style="text-align:center; display:block;">นำเข้าไฟล์สำรองข้อมูล</label>
      <input type="file" id="import-file" accept="application/json" style="display:none;" />
    </div>
  `;

  document.querySelectorAll('[data-goto-sub]').forEach((el) => {
    el.addEventListener('click', () => navigate(el.dataset.gotoSub));
  });

  document.getElementById('btn-export').addEventListener('click', async () => {
    const data = await exportAllData();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tuadueng-backup-${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('import-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!confirm('การนำเข้าจะลบข้อมูลปัจจุบันทั้งหมดแล้วแทนที่ด้วยไฟล์นี้ ยืนยันหรือไม่?')) return;
    try {
      const text = await file.text();
      await importAllData(JSON.parse(text));
      showToast('นำเข้าข้อมูลสำเร็จ');
      renderHeader();
      navigate('dashboard');
    } catch (err) {
      showToast('นำเข้าไม่สำเร็จ: ' + err.message);
    }
  });
}

// ------------------------------------------------------------
// View: วัตถุดิบ / สต็อก (Ingredients)
// ------------------------------------------------------------
async function renderIngredients() {
  const ingredients = await listIngredients({ activeOnly: true });
  const lowStock = new Set((await listLowStockIngredients()).map((i) => i.id));
  const overdueList = await listOverdueStockCounts();
  const overdueMap = Object.fromEntries(overdueList.map((o) => [o.ingredient.id, o.reason]));
  const today = todayStr();

  const cardsHtml = ingredients.length
    ? ingredients
        .map((ing) => {
          const stamps = [];
          if (lowStock.has(ing.id)) stamps.push(`<span class="stamp warn">ใกล้หมด</span>`);
          if (overdueMap[ing.id]) stamps.push(`<span class="stamp warn">${escapeHtml(overdueMap[ing.id])}</span>`);
          if (stamps.length === 0) stamps.push(`<span class="stamp ok">ปกติ</span>`);

          return `
        <div class="card" data-ingredient-card="${ing.id}">
          <div class="row-item" style="border-bottom:none; padding-top:0;">
            <span class="label" style="font-weight:700; color:var(--ink); font-size:15px;">${escapeHtml(ing.name)}</span>
            <button class="btn-danger-text" data-remove-ingredient="${ing.id}">ลบ</button>
          </div>
          <div style="margin-bottom:10px;">${stamps.join(' ')}</div>
          <div class="row-item">
            <span class="label">คงเหลือ</span>
            <span class="value">${ing.current_stock} ${escapeHtml(ing.unit)}</span>
          </div>
          <div class="row-item">
            <span class="label">ต้นทุนเฉลี่ย/หน่วย</span>
            <span class="value">${formatMoney(ing.current_avg_cost)}</span>
          </div>

          <h3 style="margin-top:14px;">บันทึกซื้อเข้า</h3>
          <div class="field-grid">
            <div class="field">
              <label>จำนวน (${escapeHtml(ing.unit)})</label>
              <input type="number" min="0" step="any" data-purchase-qty="${ing.id}" />
            </div>
            <div class="field">
              <label>ราคา/หน่วย (บาท)</label>
              <input type="number" min="0" step="any" data-purchase-cost="${ing.id}" />
            </div>
          </div>
          <input type="date" data-purchase-date="${ing.id}" value="${today}" style="margin-bottom:10px;" />
          <button class="btn btn-ghost btn-small" data-save-purchase="${ing.id}">บันทึกซื้อเข้า</button>

          <h3 style="margin-top:16px;">นับสต็อกปิดร้าน</h3>
          <div class="field-grid">
            <div class="field">
              <label>จำนวนที่นับได้ (${escapeHtml(ing.unit)})</label>
              <input type="number" min="0" step="any" data-count-closing="${ing.id}" />
            </div>
            <div class="field">
              <label>วันที่นับ</label>
              <input type="date" data-count-date="${ing.id}" value="${today}" />
            </div>
          </div>
          <button class="btn btn-primary btn-small" data-save-count="${ing.id}">บันทึกนับสต็อก</button>
          <div data-count-result="${ing.id}" style="margin-top:8px; font-size:13px; color:var(--ink-soft);"></div>
        </div>`;
        })
        .join('')
    : `<div class="card"><div class="empty-state"><p>ยังไม่มีวัตถุดิบ</p><p>เพิ่มรายการแรกด้านล่างได้เลย</p></div></div>`;

  $content.innerHTML = `
    <h1 class="section-title">วัตถุดิบ / สต็อก</h1>
    ${cardsHtml}
    <div class="card">
      <h2>เพิ่มวัตถุดิบใหม่</h2>
      <div class="field">
        <label for="ing-name">ชื่อวัตถุดิบ</label>
        <input type="text" id="ing-name" placeholder="เช่น ไก่, เส้นก๋วยเตี๋ยว" />
      </div>
      <div class="field-grid">
        <div class="field">
          <label for="ing-unit">หน่วยนับ</label>
          <input type="text" id="ing-unit" placeholder="กก., ขวด, ถุง" />
        </div>
        <div class="field">
          <label for="ing-reorder">จุดสั่งซื้อ (ใกล้หมดเมื่อเหลือน้อยกว่านี้)</label>
          <input type="number" id="ing-reorder" min="0" value="0" />
        </div>
      </div>
      <div class="field">
        <label for="ing-frequency">ความถี่การนับสต็อก</label>
        <select id="ing-frequency">
          <option value="daily">นับทุกวัน</option>
          <option value="weekly">นับทุกสัปดาห์</option>
        </select>
      </div>
      <button class="btn btn-ghost" id="btn-add-ingredient">+ เพิ่มวัตถุดิบ</button>
    </div>
  `;

  document.getElementById('btn-add-ingredient').addEventListener('click', async () => {
    const name = document.getElementById('ing-name').value.trim();
    const unit = document.getElementById('ing-unit').value.trim();
    if (!name || !unit) { showToast('กรุณาใส่ชื่อและหน่วยนับ'); return; }
    try {
      await createIngredient({
        name,
        unit,
        reorder_point: Number(document.getElementById('ing-reorder').value) || 0,
        count_frequency: document.getElementById('ing-frequency').value,
      });
      showToast('เพิ่มวัตถุดิบสำเร็จ');
      renderIngredients();
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message);
    }
  });

  document.querySelectorAll('[data-remove-ingredient]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const result = await removeIngredient(btn.dataset.removeIngredient);
      showToast(result.deleted ? 'ลบวัตถุดิบสำเร็จ' : 'ซ่อนวัตถุดิบแล้ว (มีประวัติซื้อ/นับอยู่ ลบจริงไม่ได้)');
      renderIngredients();
    });
  });

  document.querySelectorAll('[data-save-purchase]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.savePurchase;
      const qty = Number(document.querySelector(`[data-purchase-qty="${id}"]`).value) || 0;
      const cost = Number(document.querySelector(`[data-purchase-cost="${id}"]`).value) || 0;
      const date = document.querySelector(`[data-purchase-date="${id}"]`).value;
      if (qty <= 0) { showToast('กรุณาใส่จำนวนที่ซื้อ'); return; }
      try {
        await recordPurchase({ ingredient_id: id, purchase_date: date, quantity: qty, unit_cost: cost });
        showToast('บันทึกซื้อเข้าสำเร็จ');
        renderIngredients();
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  });

  document.querySelectorAll('[data-save-count]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.saveCount;
      const closing = Number(document.querySelector(`[data-count-closing="${id}"]`).value) || 0;
      const date = document.querySelector(`[data-count-date="${id}"]`).value;
      try {
        const result = await recordStockCount({ ingredient_id: id, count_date: date, closing_count: closing });
        document.querySelector(`[data-count-result="${id}"]`).textContent =
          `ใช้ไป ${result.used_qty} หน่วย มูลค่า ${formatMoney(result.used_value)}`;
        showToast('บันทึกนับสต็อกสำเร็จ');
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  });
}

// ------------------------------------------------------------
// Router
// ------------------------------------------------------------
const views = { dashboard: renderDashboard, entry: () => renderEntry(), menu: renderMenuSettings, more: renderMore, ingredients: renderIngredients };
const navHighlightFor = { ingredients: 'more' };

async function navigate(viewName) {
  const highlightAs = navHighlightFor[viewName] || viewName;
  $nav.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.view === highlightAs));
  await views[viewName]();
  window.scrollTo(0, 0);
}

$nav.querySelectorAll('button').forEach((btn) => {
  btn.addEventListener('click', () => navigate(btn.dataset.view));
});

// ------------------------------------------------------------
// Service worker registration
// ------------------------------------------------------------
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch((err) => console.warn('SW register failed:', err));
}

// เผื่อ debug ผ่าน browser devtools console (เช่น window.__app.db.daily_entries.toArray())
window.__app = { db, getSetting, setSetting };

// ------------------------------------------------------------
// Boot
// ------------------------------------------------------------
(async function boot() {
  try {
    await bootstrapDefaults();
    await renderHeader();
    await navigate('dashboard');
  } catch (err) {
    $content.innerHTML = `<div class="card"><p>เกิดข้อผิดพลาดตอนเปิดแอป: ${escapeHtml(err.message)}</p></div>`;
    console.error(err);
  }
})();


</script>
</body>
