      <button class="btn btn-ghost" id="btn-export" style="margin-bottom:10px;">ดาวน์โหลดไฟล์สำรองข้อมูล</button>
      <label for="import-file" class="btn btn-primary" style="text-align:center; display:block;">นำเข้าไฟล์สำรองข้อมูล</label>
      <input type="file" id="import-file" accept="application/json" style="display:none;" />
    </div>
  `;

  document.querySelectorAll('[data-goto-sub]').forEach((el) => {
    el.addEventListener('click', () => navigate(el.dataset.gotoSub));
  });

  document.getElementById('btn-export').addEventListener('click', async () => {
    const data = await exportAllData();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tuadueng-backup-${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('import-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!confirm('การนำเข้าจะลบข้อมูลปัจจุบันทั้งหมดแล้วแทนที่ด้วยไฟล์นี้ ยืนยันหรือไม่?')) return;
    try {
      const text = await file.text();
      const result = await importAllData(JSON.parse(text));
      showToast(
        result.missing_tables.length > 0
          ? `นำเข้าสำเร็จ แต่ไฟล์นี้ไม่มีข้อมูลตาราง: ${result.missing_tables.join(', ')}`
          : 'นำเข้าข้อมูลสำเร็จ'
      );
      renderHeader();
      navigate('dashboard');
    } catch (err) {
      showToast('นำเข้าไม่สำเร็จ: ' + err.message);
    }
  });
}

  const gasHistory = await listGasPurchases();
  const gasEstimate = await getDailyGasCost(todayStr());
  const lastGasCost = gasHistory.length ? gasHistory[0].cost_per_tank : '';

  const fromDateObj = new Date();
  fromDateObj.setDate(fromDateObj.getDate() - 29);
  const from = fromDateObj.toISOString().slice(0, 10);

          <label for="rent-amount">ค่าเช่าใหม่ (บาท/เดือน)</label>
          <input type="number" id="rent-amount" min="0" value="${currentRent ? currentRent.monthly_rent : ''}" />
        </div>
        <div class="field">
          <label for="rent-effective-from">มีผลตั้งแต่วันที่</label>
          <input type="date" id="rent-effective-from" value="${todayStr()}" min="${currentRent ? currentRent.effective_from : ''}" />
        </div>
      </div>
      <div class="field">
        <label for="rent-note">หมายเหตุ (ไม่บังคับ)</label>
        <input type="text" id="rent-note" placeholder="เช่น ต่อสัญญาปีที่ 3 ลด 5%, ขึ้นค่าเช่าตามสัญญา" />
      </div>
      <button class="btn btn-ghost" id="btn-add-rent">+ บันทึกรอบค่าเช่าใหม่</button>
    </div>

    <div class="card">
      <h2>ค่าน้ำ / ค่าไฟ</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;">
        บันทึกสรุป<strong>ตอนสิ้นเดือน</strong>เดือนละครั้ง (ไม่ต้องจดมิเตอร์รายวัน) ระบบจะหารเฉลี่ยเป็นต้นทุน/วันให้เอง
        ${
          currentMonthUtility
            ? ''
            : utilityFallback && utilityFallback.source_month
            ? `เดือนนี้ (${thisMonth}) ยังไม่ได้กรอกบิล — ใช้ค่าประมาณการจากเดือน ${utilityFallback.source_month} แทนไปก่อน (${formatMoney(utilityFallback.value)}/วัน)`
            : 'ยังไม่เคยกรอกบิลเดือนไหนเลย ค่าใช้จ่ายส่วนนี้จะยังไม่ถูกนับใน P&L จนกว่าจะกรอกครั้งแรก'
        }
      </p>
      <div class="field-grid">
        <div class="field">
          <label for="util-period">เดือนที่บันทึก</label>
          <input type="month" id="util-period" value="${currentMonthUtility ? currentMonthUtility.period_month : thisMonth}" max="${thisMonth}" />
        </div>
        <div class="field">
          <label for="util-days">จำนวนวันที่เปิดร้านในเดือนนี้</label>
          <input type="number" id="util-days" min="1" max="31" placeholder="ปล่อยว่าง = เต็มเดือน" value="${currentMonthUtility && currentMonthUtility.days_in_period ? currentMonthUtility.days_in_period : ''}" />
        </div>
      </div>
      <div class="field-grid">
        <div class="field">
          <label for="util-water">ค่าน้ำ (บาท)</label>
          <input type="number" id="util-water" min="0" value="${currentMonthUtility ? currentMonthUtility.water_bill_amount : ''}" />
        </div>
        <div class="field">
          <label for="util-electric">ค่าไฟ (บาท)</label>
          <input type="number" id="util-electric" min="0" value="${currentMonthUtility ? currentMonthUtility.electric_bill_amount : ''}" />
        </div>
      </div>
      <div class="field">
        <label for="util-note">หมายเหตุ (ไม่บังคับ)</label>
        <input type="text" id="util-note" value="${currentMonthUtility && currentMonthUtility.note ? escapeHtml(currentMonthUtility.note) : ''}" />
      </div>
      <button class="btn btn-ghost" id="btn-save-utility">${currentMonthUtility ? 'บันทึกการแก้ไขบิลเดือนนี้' : '+ บันทึกบิลเดือนนี้'}</button>

      <details style="margin-top:18px;">
        <summary style="cursor:pointer;font-weight:700;">ดูประวัติบิลรายเดือน (${utilityHistory.length})</summary>
        <div class="row-list" style="margin-top:8px;">${utilityHistoryHtml}</div>
      </details>
    </div>

    <div class="card">
      <h2>ค่าแก๊สหุงต้ม</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;">
        บันทึกทุกครั้งที่<strong>สั่งซื้อ/เติมถัง</strong> (ไม่ผูกกับรอบเดือน เพราะหมดแล้วสั่งเพิ่มไม่ตรงรอบ) ระบบจะประมาณต้นทุน/วันจากอัตราการใช้ย้อนหลัง ${gasEstimate.basis_days || 30} วันให้อัตโนมัติ
        ${gasEstimate.purchases_count > 0 ? ` — ตอนนี้ประมาณ ${formatMoney(gasEstimate.value)}/วัน${gasEstimate.is_estimated ? ' (ประมาณการจากประวัติ เพราะช่วงนี้ยังไม่มีการซื้อใหม่)' : ''}` : ' — ยังไม่มีข้อมูลพอประมาณการ'}
      </p>
      <div class="field-grid">
        <div class="field">
          <label for="gas-date">วันที่ซื้อ</label>
          <input type="date" id="gas-date" value="${todayStr()}" max="${todayStr()}" />
        </div>
        <div class="field">
          <label for="gas-tanks">จำนวนถัง</label>
          <input type="number" id="gas-tanks" min="1" />
        </div>
      </div>
      <div class="field">
        <label for="gas-cost">ราคาต่อถัง (บาท)</label>
        <input type="number" id="gas-cost" min="0" value="${lastGasCost}" />
      </div>
      <div class="field">
        <label for="gas-note">หมายเหตุ (ไม่บังคับ)</label>
        <input type="text" id="gas-note" placeholder="เช่น ร้านประจำ, ราคาขึ้นรอบนี้" />
      </div>
      <button class="btn btn-ghost" id="btn-add-gas">+ บันทึกการซื้อแก๊ส</button>

      <details style="margin-top:18px;">
        <summary style="cursor:pointer;font-weight:700;">ดูประวัติการซื้อแก๊ส (${gasHistory.length})</summary>
        <div class="row-list" style="margin-top:8px;">${gasHistoryHtml}</div>
      </details>
    </div>

    <div class="card">
      <h2>ค่าใช้จ่ายประจำอื่นๆ</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;">สำหรับรายการอื่นที่ไม่ใช่ค่าเช่า/น้ำ/ไฟ/แก๊ส เช่น ค่าเน็ต ค่าแรงประจำ — คิดเฉลี่ยเป็นต้นทุนรายวันในหน้าสรุปอัตโนมัติ<br/><strong style="color:var(--ember-deep)">อย่าเพิ่ม "ค่าเช่า", "ค่าน้ำ/ค่าไฟ" หรือ "ค่าแก๊ส" ที่นี่ซ้ำ</strong> เพราะสามรายการนี้ย้ายไปจัดการในการ์ดด้านบนแล้ว ถ้ายังมีของเก่าค้างอยู่ ให้กดลบทิ้ง ไม่งั้นจะถูกนับซ้ำ</p>
      <div class="row-list">${expensesListHtml}</div>
    </div>

    <div class="card">
      <h2>เพิ่มค่าใช้จ่ายประจำ</h2>
      <div class="field">
        <label for="exp-name">ชื่อรายการ</label>
        <input type="text" id="exp-name" placeholder="เช่น ค่าเน็ต, ค่าแรงประจำ (ไม่ใช่ค่าเช่า/น้ำ/ไฟ)" />
      </div>
      <div class="field-grid">
        <div class="field">
          <label for="exp-amount">จำนวนเงิน (บาท)</label>
          <input type="number" id="exp-amount" min="0" />
        </div>
        <div class="field">
          <label for="exp-frequency">ความถี่</label>
          <select id="exp-frequency">
            <option value="monthly">รายเดือน (เฉลี่ย/วัน)</option>
            <option value="weekly">รายสัปดาห์ (เฉลี่ย/วัน)</option>
            <option value="once">ครั้งเดียว (ลงเต็มจำนวนวันเดียว)</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="exp-start-date" id="exp-start-date-label">เริ่มมีผลตั้งแต่วันที่</label>
        <input type="date" id="exp-start-date" value="${todayStr()}" />
        <p style="font-size:12px;color:var(--ink-soft);margin:6px 0 0;">
          <strong>รายเดือน/รายสัปดาห์:</strong> เหมาะกับค่าเช่า ค่าเน็ต ที่จ่ายสม่ำเสมอ ระบบจะเฉลี่ยเป็นต้นทุนราย วัน ให้อัตโนมัติ<br/>
          <strong>ครั้งเดียว:</strong> เหมาะกับของที่จ่ายไม่สม่ำเสมอ เช่น <strong>ค่าแก๊สหุงต้ม</strong> (เติมกี่วันครั้งไม่แน่นอน) หรือค่าซ่อมบำรุงเฉพาะครั้ง — จะลงเต็มจำนวนในวันที่ระบุวันเดียว ไม่เฉลี่ย
        </p>
      </div>
      <button class="btn btn-ghost" id="btn-add-expense">+ เพิ่มค่าใช้จ่าย</button>
    </div>

    <div class="card">
      <h2>บันทึกจ่ายจริง</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;">
        รายการนี้ใช้สำหรับ<strong>ดูภาพรวมเงินสดที่จ่ายออกจริง</strong>เท่านั้น — <strong>ไม่ได้ไปลดกำไรสุทธิ</strong> (กำไรสุทธิคำนวณจากต้นทุนวัตถุดิบที่นับสต็อก + ค่าใช้จ่ายประจำด้านบนเท่านั้น) ถ้าอยากให้รายจ่ายนี้ไปลดกำไรด้วย ให้เพิ่มเป็น "ค่าใช้จ่ายประจำ" ด้านบนแทน (เลือกความถี่ "ครั้งเดียว" ได้ถ้าจ่ายไม่สม่ำเสมอ)
      </p>
      <div class="field">
        <label for="pay-expense">ผูกกับรายการประจำ (ถ้ามี)</label>
        <select id="pay-expense">${expenseOptions}</select>
      </div>
      <div class="field-grid">
        <div class="field">
          <label for="pay-date">วันที่จ่าย</label>
          <input type="date" id="pay-date" value="${todayStr()}" max="${todayStr()}" />
        </div>
        <div class="field">
          <label for="pay-amount">จำนวนเงิน (บาท)</label>
          <input type="number" id="pay-amount" min="0" />
        </div>
      </div>
      <div class="field">
        <label for="pay-category">หมวดหมู่</label>
        <input type="text" id="pay-category" placeholder="เช่น ค่าเช่า, ซ่อมบำรุง, ค่าน้ำค่าไฟ" />
        <p style="font-size:12px;color:var(--ink-soft);margin:6px 0 0;">ใช้บันทึกรายจ่ายอื่นๆ ที่ไม่ใช่วัตถุดิบ (เช่น ค่าเช่า ค่าแรง ซ่อมบำรุง) — <strong>ไม่ต้องบันทึกยอดซื้อวัตถุดิบซ้ำที่นี่</strong> เพราะระบบดึงยอดจากหน้า "วัตถุดิบ" มารวมในรายงานค่าใช้จ่ายให้อัตโนมัติอยู่แล้ว</p>
      </div>
      <div class="field">
        <label for="pay-note">โน้ต (ถ้ามี)</label>
        <input type="text" id="pay-note" />
      </div>
      <button class="btn btn-primary" id="btn-add-payment">+ บันทึกจ่ายจริง</button>
    </div>

    <div class="card">
      <h2>รายการจ่ายจริง 30 วันล่าสุด</h2>
      <div class="row-list">${paymentsListHtml}</div>
    </div>
  `;

  document.getElementById('btn-add-rent').addEventListener('click', async () => {
    const monthly_rent = Number(document.getElementById('rent-amount').value);
    const effective_from = document.getElementById('rent-effective-from').value;
    const note = document.getElementById('rent-note').value.trim() || null;
    if (!(monthly_rent >= 0)) { showToast('กรุณาใส่ค่าเช่าให้ถูกต้อง'); return; }
    if (!effective_from) { showToast('กรุณาเลือกวันที่เริ่มมีผล'); return; }
    const futureNote = effective_from > todayStr() ? ` (มีผลในอนาคต — ค่าเช่าปัจจุบันยังใช้ต่อไปจนถึง ${effective_from})` : '';
    if (!confirm(`ยืนยันบันทึกค่าเช่าใหม่ ${formatMoney(monthly_rent)}/เดือน ตั้งแต่วันที่ ${effective_from}?${futureNote}`)) return;
    try {
      const result = await addRentChange({ monthly_rent, effective_from, note });
      showToast(
        result.regenerated_dates_count > 0
          ? `บันทึกรอบค่าเช่าใหม่สำเร็จ — อัปเดต P&L ย้อนหลังแล้ว ${result.regenerated_dates_count} วัน`
          : 'บันทึกรอบค่าเช่าใหม่สำเร็จ'
      );
      renderFinance();
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message);
    }
  });

  const removeLatestRentBtn = document.getElementById('btn-remove-latest-rent');
  if (removeLatestRentBtn) {
    removeLatestRentBtn.addEventListener('click', async () => {
      if (!confirm('ยกเลิกรอบค่าเช่าล่าสุด? รอบก่อนหน้าจะกลับมาเป็น "ปัจจุบัน" แทน')) return;
      try {
        await removeLatestRentChange();
        showToast('ยกเลิกรอบล่าสุดแล้ว');
        renderFinance();
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  }

  // สลับเดือนในฟอร์ม "ค่าน้ำ/ไฟ" ต้องโหลดข้อมูลของเดือนนั้นมาแสดงใหม่เสมอ ไม่งั้นตัวเลขของเดือนที่เพิ่งดูอยู่
  // จะค้างอยู่ในช่อง แล้วกดบันทึกทับเดือนอื่นโดยไม่ตั้งใจ
  document.getElementById('util-period').addEventListener('change', async (e) => {
    const period = e.target.value;
    if (!period) return;
    const existing = await getUtilityForMonth(period);
    document.getElementById('util-water').value = existing ? existing.water_bill_amount : '';
    document.getElementById('util-electric').value = existing ? existing.electric_bill_amount : '';
    document.getElementById('util-days').value = existing && existing.days_in_period ? existing.days_in_period : '';
    document.getElementById('util-note').value = existing && existing.note ? existing.note : '';
    document.getElementById('btn-save-utility').textContent = existing ? 'บันทึกการแก้ไขบิลเดือนนี้' : '+ บันทึกบิลเดือนนี้';
  });

  document.getElementById('btn-save-utility').addEventListener('click', async () => {
    const period_month = document.getElementById('util-period').value;
    if (!period_month) { showToast('กรุณาเลือกเดือน'); return; }
    try {
      const result = await recordMonthlyUtility({
        period_month,
        water_bill_amount: Number(document.getElementById('util-water').value) || 0,
        electric_bill_amount: Number(document.getElementById('util-electric').value) || 0,
        days_in_period: Number(document.getElementById('util-days').value) || null,
        note: document.getElementById('util-note').value.trim() || null,
      });
      showToast(
        result.regenerated_dates_count > 0
          ? `บันทึกบิลของเดือน ${period_month} สำเร็จ — อัปเดต P&L ย้อนหลังแล้ว ${result.regenerated_dates_count} วัน`
          : `บันทึกบิลของเดือน ${period_month} สำเร็จ`
      );
      renderFinance();
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message);
    }
  });

  document.querySelectorAll('[data-remove-utility]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('ลบบิลเดือนนี้? วันในเดือนนี้จะกลับไปใช้ค่าประมาณการจากเดือนอื่นแทน')) return;
      await removeMonthlyUtility(btn.dataset.removeUtility);
      showToast('ลบบิลเดือนนั้นแล้ว');
      renderFinance();
    });
  });

  document.getElementById('btn-add-gas').addEventListener('click', async () => {
    const purchase_date = document.getElementById('gas-date').value;
    const tanks_qty = Number(document.getElementById('gas-tanks').value);
    const cost_per_tank = Number(document.getElementById('gas-cost').value);
    const note = document.getElementById('gas-note').value.trim() || null;
    try {
      const result = await recordGasPurchase({ purchase_date, tanks_qty, cost_per_tank, note });
      showToast(
        result.regenerated_dates_count > 0
          ? `บันทึกการซื้อแก๊สสำเร็จ — อัปเดตค่าประมาณการย้อนหลังแล้ว ${result.regenerated_dates_count} วัน`
          : 'บันทึกการซื้อแก๊สสำเร็จ'
      );
      renderFinance();
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message);
    }
  });

  document.querySelectorAll('[data-remove-gas]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('ลบรายการซื้อแก๊สนี้? ค่าประมาณการรายวันของช่วงนั้นจะเปลี่ยนไปตาม')) return;
      await removeGasPurchase(btn.dataset.removeGas);
      showToast('ลบรายการซื้อแก๊สแล้ว');
      renderFinance();
    });
  });

  document.getElementById('btn-add-expense').addEventListener('click', async () => {
    const name = document.getElementById('exp-name').value.trim();
    if (/เช่า|น้ำ|ไฟ|แก๊ส|gas/i.test(name) && !confirm(`"${name}" ฟังดูคล้ายค่าเช่า/น้ำ/ไฟ/แก๊ส ซึ่งมีการ์ดจัดการแยกไว้ด้านบนแล้ว (กันนับซ้ำ) ยืนยันว่าต้องการเพิ่มเป็นค่าใช้จ่ายทั่วไปจริงๆ?`)) return;
    if (!name) { showToast('กรุณาใส่ชื่อรายการ'); return; }
    try {
      await createOperatingExpense({
        name,
        amount: Number(document.getElementById('exp-amount').value) || 0,
        frequency: document.getElementById('exp-frequency').value,
        start_date: document.getElementById('exp-start-date').value,
      });
      showToast('เพิ่มค่าใช้จ่ายประจำสำเร็จ');
      renderFinance();
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message);
    }
  });

  document.querySelectorAll('[data-remove-expense]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const result = await removeOperatingExpense(btn.dataset.removeExpense);
      showToast(result.deleted ? 'ลบค่าใช้จ่ายประจำสำเร็จ' : 'ซ่อนรายการแล้ว (เคยมีประวัติจ่ายจริงอยู่ ลบจริงไม่ได้ — แนะนำตั้งวันที่สิ้นสุดแทน)');
      renderFinance();
    });
  });

  document.getElementById('btn-add-payment').addEventListener('click', async () => {
    const category = document.getElementById('pay-category').value.trim();
    if (!category) { showToast('กรุณาใส่หมวดหมู่'); return; }
    try {
      await recordExpensePayment({
        operating_expense_id: document.getElementById('pay-expense').value || null,
        payment_date: document.getElementById('pay-date').value,
        amount: Number(document.getElementById('pay-amount').value) || 0,
        category,
        note: document.getElementById('pay-note').value || null,
      });
      showToast('บันทึกจ่ายจริงสำเร็จ');
      renderFinance();
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message);
    }
  });

  document.querySelectorAll('[data-remove-payment]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      await removeExpensePayment(btn.dataset.removePayment);
      showToast('ลบรายการจ่ายจริงสำเร็จ');
      renderFinance();
    });
  });
}

// ------------------------------------------------------------
// View: รายงาน (Reports)
// ------------------------------------------------------------
async function renderReports(fromParam, toParam) {
  const today = todayStr();
  const defaultFrom = fromParam || `${today.slice(0, 7)}-01`; // ต้นเดือนปัจจุบัน

         ${weekday.suggestion.avg_profit < 0 ? ' และขาดทุนโดยเฉลี่ย น่าจะลองพิจารณาหยุดร้านวันนี้ดู' : ' ลองเทียบกับต้นทุนคงที่ที่ยังต้องจ่ายแม้ปิดร้าน ก่อนตัดสินใจ'}
       </p>`
    : `<p style="font-size:13px;color:var(--ink-soft);margin-top:10px;">ต้องมีข้อมูลอย่างน้อย 2 ครั้งของแต่ละวัน และครบอย่างน้อย 3 วันในสัปดาห์ที่ต่างกัน ถึงจะวิเคราะห์ได้แม่นยำพอ — บันทึกยอดขายต่อไปเรื่อยๆ แล้วกลับมาดูใหม่</p>`;

  $content.innerHTML = `
    <h1 class="section-title">รายงาน</h1>

    <div class="card">
      <h2>ช่วงวันที่ดูรายงาน</h2>
      <div class="field-grid">
        <div class="field">
          <label for="rep-from">จากวันที่</label>

      </div>

    <div class="card">
      <h2>กำไรเฉลี่ยตามวันในสัปดาห์ (แนะนำวันหยุดร้าน)</h2>

    <div class="card">

      <div class="row-list">${topItemsHtml}</div>

    <div class="card">
      <h2>สรุปรายเดือน</h2>

    </div>

    <div class="card">
      <h2>ค่าใช้จ่ายจริงแยกตามหมวดหมู่</h2>
      ${expenseBreakdownHtml}

  document.getElementById('rep-from').addEventListener('change', (e) => {

let ingredientsDetailId = null;

  const lowStock = new Set((await listLowStockIngredients()).map((i) => i.id));
  const overdueList = await listOverdueStockCounts(today);
  const overdueMap = Object.fromEntries(overdueList.map((o) => [o.ingredient.id, o.reason]));
  const uncountedToday = await listIngredientsUncountedToday(today);
  const todayEntry = await db.daily_entries.where('entry_date').equals(today).first();
  const todayClosed = todayEntry?.is_closed === true;

  // ---------- ตารางสรุปวัตถุดิบทั้งหมด ----------
  const tableRowsHtml = ingredients.length
    ? ingredients
        .map((ing) => {
          const stamps = [];
          if (lowStock.has(ing.id)) stamps.push(`<span class="stamp warn">ใกล้หมด</span>`);
          if (overdueMap[ing.id]) stamps.push(`<span class="stamp warn">${escapeHtml(overdueMap[ing.id])}</span>`);
          if (stamps.length === 0) stamps.push(`<span class="stamp ok">ปกติ</span>`);
          const selected = ingredientsDetailId === ing.id;

          return `
        <tr data-ingredient-row="${ing.id}" style="cursor:pointer;${selected ? 'background:var(--paper-deep);' : ''}">
          <td style="padding:10px 8px;border-bottom:1px solid var(--line);font-weight:700;color:var(--ink);">${escapeHtml(ing.name)}</td>
          <td style="padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;">${ing.current_stock} ${escapeHtml(ing.unit)}</td>
          <td style="padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;">${formatMoney(ing.current_avg_cost)}</td>

        </tr>`;

              <th style="padding:6px;text-align:right;">จำนวน</th>

      <div class="field-grid">
        <div class="field">
          <label for="detail-purchase-qty">จำนวน (${escapeHtml(selectedIng.unit)})</label>
          <input type="number" min="0" step="any" id="detail-purchase-qty" />

          <input type="number" min="0" step="any" id="detail-purchase-cost" />

      </div>
      <input type="date" id="detail-purchase-date" value="${today}" style="margin-bottom:10px;" />
      <button class="btn btn-ghost btn-small" id="btn-detail-save-purchase">บันทึกซื้อเข้า</button>

    </div>

    <div class="card">

      <p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;">ดูว่าวัตถุดิบแต่ละอย่างถูกใช้ไปมากน้อยแค่ไหนในแต่ละวัน เพื่อประเมินต้นทุนอาหาร</p>

      ? report.records
          .map(
            (r) => `
        <tr>
          <td style="padding:7px 6px;border-bottom:1px solid var(--line);">${r.count_date}</td>
          <td style="padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;">${r.used_qty} ${escapeHtml(ing.unit)}</td>
          <td style="padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;">${formatMoney(r.used_value)}</td>
        </tr>`
          )
          .join('')
      : `<tr><td colspan="3" style="padding:10px 6px;color:var(--ink-soft);">ไม่มีข้อมูลการนับสต็อกในช่วงนี้</td></tr>`;

    document.getElementById('usage-result').innerHTML = `
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead>
            <tr style="text-align:left;color:var(--ink-soft);font-size:12px;">
              <th style="padding:6px;">วันที่นับ</th>
              <th style="padding:6px;text-align:right;">ใช้ไป</th>
              <th style="padding:6px;text-align:right;">มูลค่า</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      <div class="row-item" style="border-bottom:none;margin-top:4px;">
        <span class="label" style="font-weight:700;">รวมทั้งช่วง</span>
        <span class="value">${report.total_used_qty} ${escapeHtml(ing.unit)} (${formatMoney(report.total_used_value)})</span>
      </div>
    `;
  });

  document.querySelectorAll('[data-ingredient-row]').forEach((row) => {
    row.addEventListener('click', () => {
      const id = row.dataset.ingredientRow;
      renderIngredients(ingredientsDetailId === id ? null : id);
    });
  });

  const closeDetailBtn = document.querySelector('[data-close-detail]');
  if (closeDetailBtn) closeDetailBtn.addEventListener('click', () => renderIngredients(null));

  const removeBtn = document.querySelector('[data-remove-ingredient]');
  if (removeBtn) {
    removeBtn.addEventListener('click', async () => {
      const result = await removeIngredient(removeBtn.dataset.removeIngredient);
      showToast(result.deleted ? 'ลบวัตถุดิบสำเร็จ' : 'ซ่อนวัตถุดิบแล้ว (มีประวัติซื้อ/นับอยู่ ลบจริงไม่ได้)');
      renderIngredients(null);
    });
  }

  const savePurchaseBtn = document.getElementById('btn-detail-save-purchase');
  if (savePurchaseBtn) {
    savePurchaseBtn.addEventListener('click', async () => {
      const qty = Number(document.getElementById('detail-purchase-qty').value) || 0;
      const cost = Number(document.getElementById('detail-purchase-cost').value) || 0;
      const date = document.getElementById('detail-purchase-date').value;
      if (qty <= 0) { showToast('กรุณาใส่จำนวนที่ซื้อ'); return; }
      try {
        await recordPurchase({ ingredient_id: ingredientsDetailId, purchase_date: date, quantity: qty, unit_cost: cost });
        showToast('บันทึกซื้อเข้าสำเร็จ');
        renderIngredients(ingredientsDetailId);
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  }

  const saveCountBtn = document.getElementById('btn-detail-save-count');
  if (saveCountBtn) {
    saveCountBtn.addEventListener('click', async () => {
      const closing = Number(document.getElementById('detail-count-closing').value) || 0;
      const date = document.getElementById('detail-count-date').value;
      try {
        const result = await recordStockCount({ ingredient_id: ingredientsDetailId, count_date: date, closing_count: closing });
        document.getElementById('detail-count-result').textContent =
          `ใช้ไป ${result.used_qty} หน่วย มูลค่า ${formatMoney(result.used_value)}`;
        showToast('บันทึกนับสต็อกสำเร็จ');
        renderIngredients(ingredientsDetailId);
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  }

  document.querySelectorAll('[data-save-purchase]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('tr');
      const purchase_date = row.querySelector('.edit-purchase-date').value;
      const quantity = Number(row.querySelector('.edit-purchase-qty').value);
      const unit_cost = Number(row.querySelector('.edit-purchase-cost').value);
      if (!(quantity > 0) || unit_cost < 0) { showToast('จำนวน/ราคาไม่ถูกต้อง'); return; }
      try {
        await updatePurchase(btn.dataset.savePurchase, { purchase_date, quantity, unit_cost });
        showToast('แก้ไขรายการซื้อแล้ว — คำนวณต้นทุนและ COGS วันหลังจากนี้ใหม่ให้แล้ว');
        renderIngredients(ingredientsDetailId);
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  });

  document.querySelectorAll('[data-remove-purchase]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('ลบรายการซื้อนี้? ระบบจะคำนวณต้นทุนเฉลี่ยและ COGS ของทุกวันหลังจากนี้ใหม่')) return;
      try {
        await removePurchase(btn.dataset.removePurchase);
        showToast('ลบรายการซื้อแล้ว');
        renderIngredients(ingredientsDetailId);
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  });

  document.querySelectorAll('[data-save-count]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('tr');
      const closing_count = Number(row.querySelector('.edit-count-closing').value);
      if (Number.isNaN(closing_count)) { showToast('จำนวนที่นับไม่ถูกต้อง'); return; }
      try {
        await updateStockCount(btn.dataset.saveCount, { closing_count });
        showToast('แก้ไขการนับสต็อกแล้ว — คำนวณ COGS วันหลังจากนี้ใหม่ให้แล้ว');
        renderIngredients(ingredientsDetailId);
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  });

  document.querySelectorAll('[data-remove-count]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('ลบรายการนับสต็อกนี้? ระบบจะคำนวณ COGS ของทุกวันหลังจากนี้ใหม่')) return;
      try {
        await removeStockCount(btn.dataset.removeCount);
        showToast('ลบรายการนับสต็อกแล้ว');
        renderIngredients(ingredientsDetailId);
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  });
}

// ------------------------------------------------------------
// Router
// ------------------------------------------------------------
const views = { dashboard: renderDashboard, entry: () => renderEntry(), menu: renderMenuSettings, more: renderMore, ingredients: () => renderIngredients(null), finance: renderFinance, reports: () => renderReports() };
const navHighlightFor = { reports: 'more' };

async function navigate(viewName) {
  const highlightAs = navHighlightFor[viewName] || viewName;
  $nav.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.view === highlightAs));
  await views[viewName]();
  window.scrollTo(0, 0);
}

$nav.querySelectorAll('button').forEach((btn) => {
  btn.addEventListener('click', () => navigate(btn.dataset.view));
});

// ------------------------------------------------------------
// Service worker registration
// ------------------------------------------------------------
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch((err) => console.warn('SW register failed:', err));
}

// เผื่อ debug ผ่าน browser devtools console (เช่น window.__app.db.daily_entries.toArray())
window.__app = {
  db, getSetting, setSetting, listOverdueStockCounts, recordPurchase, recordStockCount, getHeadcountSummary,
  addRentChange, getRentForDate, getCurrentRent, getRentHistory, removeLatestRentChange, getDailyRentCost,
  recordMonthlyUtility, getUtilityForMonth, listUtilityHistory, getDailyUtilityCost, removeMonthlyUtility,
  recordGasPurchase, listGasPurchases, getDailyGasCost, removeGasPurchase,
  regenerateSummariesInRange,
};

// ------------------------------------------------------------
// Boot
// ------------------------------------------------------------
(async function boot() {
  try {
    await bootstrapDefaults();
    await renderHeader();
    await navigate('dashboard');
  } catch (err) {
    $content.innerHTML = `<div class="card"><p>เกิดข้อผิดพลาดตอนเปิดแอป: ${escapeHtml(err.message)}</p></div>`;
    console.error(err);
  }
})();


</script>
</body>
</html>
