/** สีประจำหมวดหมู่วัตถุดิบ — คำนวณจากชื่อหมวดหมู่ (hash) เพื่อให้สีเดิมคงที่เสมอ ไม่ว่าจะมีหมวดอื่นเพิ่ม/ลบไปกี่หมวดก็ตาม */
const CATEGORY_COLOR_PALETTE = [
  { bg: '#EFDCCD', text: '#8C3B26' }, // ember
  { bg: '#E4E6DA', text: '#4B5A3A' }, // moss
  { bg: '#F3E3B8', text: '#8A6A1B' }, // brass / gold
  { bg: '#E6D9EC', text: '#5C3B73' }, // plum
  { bg: '#D9E6E6', text: '#2E5C5C' }, // teal
  { bg: '#E9DCE0', text: '#7A3B4A' }, // rose
  { bg: '#DCE3EC', text: '#3B4F73' }, // slate blue
  { bg: '#E8E0D0', text: '#6B5B2A' }, // olive
];
function getCategoryColor(categoryName) {
  if (!categoryName) return { bg: 'var(--paper-deep)', text: 'var(--ink-soft)' };
  let hash = 0;
  for (let i = 0; i < categoryName.length; i++) hash = (hash * 31 + categoryName.charCodeAt(i)) >>> 0;
  return CATEGORY_COLOR_PALETTE[hash % CATEGORY_COLOR_PALETTE.length];
}
function categoryDotHtml(categoryName) {
  const c = getCategoryColor(categoryName);
  return `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c.text};margin-right:6px;flex-shrink:0;"></span>`;
}

function csvValue(v) {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadTextFile(filename, content, mime = 'text/csv;charset=utf-8;') {
  const blob = new Blob(['\uFEFF' + content], { type: mime }); // BOM กัน Excel อ่านภาษาไทยเพี้ยน
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

/** ส่งออกประวัติซื้อวัตถุดิบทุกล็อต (ราคาที่เปลี่ยนไปในแต่ละครั้งที่ซื้อ) เป็น CSV เพื่อเอาไปทำสรุปต่อ */
async function exportIngredientPurchaseLotsCsv() {
  const ingredients = await db.ingredients.toArray();
  const nameById = Object.fromEntries(ingredients.map((i) => [i.id, i.name]));
  const unitById = Object.fromEntries(ingredients.map((i) => [i.id, i.unit]));
  const purchases = await db.ingredient_purchases.toArray();
  purchases.sort(
    (a, b) =>
      (nameById[a.ingredient_id] || '').localeCompare(nameById[b.ingredient_id] || '') ||
      a.purchase_date.localeCompare(b.purchase_date)
  );

  const header = ['วัตถุดิบ', 'หน่วย', 'วันที่ซื้อ', 'จำนวน', 'ราคา/หน่วย', 'มูลค่ารวม', 'ต้นทุนเฉลี่ยก่อนซื้อ', 'ต้นทุนเฉลี่ยหลังซื้อ'];
  const lines = [header.map(csvValue).join(',')];
  for (const p of purchases) {
    lines.push(
      [
        nameById[p.ingredient_id] || '(ไม่พบวัตถุดิบ)',
        unitById[p.ingredient_id] || '',
        p.purchase_date,
        p.quantity,
        p.unit_cost,
        p.total_cost,
        p.avg_cost_before,
        p.avg_cost_after,
      ]
        .map(csvValue)
        .join(',')
    );
  }
  downloadTextFile(`tuadueng-ingredient-lots-${todayStr()}.csv`, lines.join('\n'));
}

async function bootstrapDefaults() {
  const fee = await getSetting('default_packaging_fee', null);
  if (fee === null) await setSetting('default_packaging_fee', 0);

  const shifts = await listShifts();
  if (shifts.length === 0) await createShift({ name: 'ทั่วไป' });

  // หมวดหมู่เริ่มต้น — สร้างเฉพาะที่ยังไม่มี ไม่กระทบหมวดที่ผู้ใช้เพิ่มเองไปแล้ว
  const ensureCategory = async (name, display_order) => {
    const existing = await db.menu_categories.where('name').equals(name).first();
    if (existing) return existing;
    return createMenuCategory({ name, display_order });
  };
  const buffetCategory = await ensureCategory('บุฟเฟต์', 0);
  await ensureCategory('อาหารจานหลัก', 1);
  await ensureCategory('เครื่องดื่ม', 2);
  await ensureCategory('ของทานเล่น', 3);

  // ย้ายราคาบุฟเฟต์เดิม (ตาราง buffet_packages รุ่นก่อน) มาเป็นเมนูปกติในหมวด "บุฟเฟต์"
  // ทำครั้งเดียวตอนยังไม่มีเมนูนี้ — ถ้าเคยตั้งราคาไว้ก่อนอัปเดต จะดึงราคาเดิมมาใช้ ไม่รีเซ็ตเป็น 0
  const ensureBuffetMenuItem = async (name, legacyPackageName) => {
    const existing = await db.menu_items.where('name').equals(name).first();
    if (existing) return existing;
    const legacyPkg = await db.buffet_packages.where('name').equals(legacyPackageName).first();
    return createMenuItem({
      category_id: buffetCategory.id,
      name,
      default_price: legacyPkg?.price || 0,
      item_type: 'standard',
    });
  };
  await ensureBuffetMenuItem('บุฟเฟต์ผู้ใหญ่', 'ผู้ใหญ่');
  await ensureBuffetMenuItem('บุฟเฟต์เด็ก', 'เด็ก');
}

function buildRevenueExpenseChartSvg(totalRevenue, totalExpense) {
  const maxVal = Math.max(totalRevenue, totalExpense, 1);
  const chartH = 110;
  const baseY = 130;
  const revH = (totalRevenue / maxVal) * chartH;
  const expH = (totalExpense / maxVal) * chartH;
  return `
    <svg viewBox="0 0 220 160" style="width:100%;max-width:280px;display:block;margin:0 auto;">
      <line x1="10" y1="${baseY}" x2="210" y2="${baseY}" stroke="var(--line)" stroke-width="1" />
      <rect x="45" y="${baseY - revH}" width="55" height="${revH}" rx="4" fill="var(--moss)" />
      <text x="72" y="${baseY - revH - 8}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${formatMoney(totalRevenue)}</text>
      <text x="72" y="${baseY + 18}" text-anchor="middle" font-size="12" fill="var(--ink-soft)">รายรับ</text>
      <rect x="120" y="${baseY - expH}" width="55" height="${expH}" rx="4" fill="var(--ember)" />
      <text x="147" y="${baseY - expH - 8}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${formatMoney(totalExpense)}</text>
      <text x="147" y="${baseY + 18}" text-anchor="middle" font-size="12" fill="var(--ink-soft)">รายจ่าย</text>
    </svg>`;
}

function buildWeekdayChartSvg(buckets) {
  const maxVal = Math.max(...buckets.map((b) => Math.abs(b.avg_profit)), 1);
  const barW = 24;
  const gap = 6;
  const chartH = 90;
  const baseY = 100;
  const totalW = buckets.length * (barW + gap) + gap;
  const bars = buckets
    .map((b, i) => {
      const x = gap + i * (barW + gap);
      const h = maxVal > 0 ? (Math.abs(b.avg_profit) / maxVal) * chartH : 0;
      const y = b.avg_profit >= 0 ? baseY - h : baseY;
      const color = b.days_count === 0 ? 'var(--line)' : b.avg_profit >= 0 ? 'var(--moss)' : 'var(--ember)';
      return `
        <rect x="${x}" y="${y}" width="${barW}" height="${Math.max(h, 1)}" rx="3" fill="${color}" />
        <text x="${x + barW / 2}" y="${baseY + 16}" text-anchor="middle" font-size="10" fill="var(--ink-soft)">${b.name.slice(0, 2)}</text>
        ${b.days_count > 0 ? `<text x="${x + barW / 2}" y="${b.avg_profit >= 0 ? y - 4 : baseY + h + 12}" text-anchor="middle" font-size="9" fill="var(--ink-soft)">${Math.round(b.avg_profit)}</text>` : ''}
      `;
    })
    .join('');
  return `
    <svg viewBox="0 0 ${totalW} 130" style="width:100%;max-width:360px;display:block;margin:0 auto;">
      <line x1="0" y1="${baseY}" x2="${totalW}" y2="${baseY}" stroke="var(--line)" stroke-width="1" />
      ${bars}
    </svg>`;
}

/** Pie chart + legend สำหรับ breakdown ค่าใช้จ่าย — รับ array ของ {category, total_amount} (เรียงมากไปน้อยแล้ว) */
function buildExpensePieChartSvg(items) {
  const palette = ['var(--ember)', 'var(--moss)', 'var(--brass)', 'var(--ember-deep)', 'var(--ink-soft)', '#7A8B99', '#B08968', '#5C7A8A'];
  const total = items.reduce((sum, i) => sum + i.total_amount, 0);
  if (total <= 0) return '';

  const cx = 100;
  const cy = 100;
  const r = 85;
  let angleStart = -Math.PI / 2;
  const slices = items.map((item, idx) => {
    const fraction = item.total_amount / total;
    const angleEnd = angleStart + fraction * 2 * Math.PI;
    const color = palette[idx % palette.length];
    let path;
    if (fraction >= 0.9999) {
      // ชิ้นเดียวครองทั้งวง (100%) — วาดเป็นวงกลมเต็ม เพราะ arc path เดียวมุม 360 องศาวาดไม่ได้ตรงๆ
      path = `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 0.01} ${cy - r} Z`;
    } else {
      const x1 = cx + r * Math.cos(angleStart);
      const y1 = cy + r * Math.sin(angleStart);
      const x2 = cx + r * Math.cos(angleEnd);
      const y2 = cy + r * Math.sin(angleEnd);
      const largeArc = angleEnd - angleStart > Math.PI ? 1 : 0;
      path = `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
    }
    angleStart = angleEnd;
    return { path, color, label: item.category, amount: item.total_amount, pct: Math.round(fraction * 100) };
  });

  const paths = slices.map((s) => `<path d="${s.path}" fill="${s.color}" stroke="var(--white)" stroke-width="2" />`).join('');
  const legend = slices
    .map(
      (s) => `
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:6px;">
        <span style="width:10px;height:10px;border-radius:2px;background:${s.color};display:inline-block;flex-shrink:0;"></span>
        <span style="color:var(--ink);">${escapeHtml(s.label)}</span>
        <span style="margin-left:auto;color:var(--ink-soft);white-space:nowrap;">${formatMoney(s.amount)} (${s.pct}%)</span>
      </div>`
    )
    .join('');

  return `
    <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;">
      <svg viewBox="0 0 200 200" style="width:150px;height:150px;flex-shrink:0;">${paths}</svg>
      <div style="flex:1;min-width:160px;">${legend}</div>
    </div>`;
}

async function renderDashboard(fromParam, toParam) {
  const today = todayStr();
  const from = fromParam || today;
  const to = toParam || today;

  const rows = await getDailySummaryRange(from, to);
  const salesReport = await getSalesReport(from, to);
  const headcount = await getHeadcountSummary(from, to);
  const lowStock = await listLowStockIngredients();
  const overdue = await listOverdueStockCounts(today);
  const overhead = await getDailyFixedOverheadBreakdown(today);
  const breakeven = await getBreakEvenHeadcount(today);

  let alertsHtml = '';
  if (lowStock.length > 0 || overdue.length > 0) {
    alertsHtml = `<div class="alert-row">`;
    if (lowStock.length > 0) {
      alertsHtml += `<span class="stamp warn">วัตถุดิบใกล้หมด ${lowStock.length} รายการ</span>`;
    }
    if (overdue.length > 0) {
      alertsHtml += `<span class="stamp warn">ยังไม่ได้นับสต็อก ${overdue.length} รายการ</span>`;
    }
    alertsHtml += `</div>`;
  }

  const totalExpense = salesReport.totals.cogs + salesReport.totals.packaging_cost + salesReport.totals.operating_expense;

  const overheadRowsHtml = [
    ['ค่าเช่า', overhead.rent],
    ['ค่าน้ำ', overhead.water],
    ['ค่าไฟ', overhead.electric],
    ['ค่าอินเทอร์เน็ต', overhead.internet],
    ['ค่าแก๊ส', overhead.gas],
    ['ค่าแรง/อื่นๆ', overhead.other],
  ]
    .filter(([, amount]) => amount > 0)
    .map(([label, amount]) => `<div class="row-item"><span class="label">${label}</span><span class="value">${formatMoney(amount)}</span></div>`)
    .join('');

  const overheadCardHtml = `
    <div class="card">
      <h2>ต้นทุนคงที่วันนี้ (${today})</h2>
      ${overheadRowsHtml || `<div class="empty-state"><p>ยังไม่มีข้อมูลต้นทุนคงที่ — ไปกรอกที่หน้า "การเงิน" ก่อน</p></div>`}

        <span class="value" style="font-weight:700;">${formatMoney(overhead.total)}</span>

    </div>`;

  let breakevenCardHtml;
  if (!breakeven.margin) {
    breakevenCardHtml = `
    <div class="card">
      <h2>จุดคุ้มทุนวันนี้</h2>
      <div class="empty-state"><p>ยังไม่มีข้อมูลหัวลูกค้าย้อนหลังพอ (30 วัน) ให้ประมาณการ — บันทึกยอดขายต่อไปเรื่อยๆ แล้วกลับมาดูใหม่</p></div>
    </div>`;
  } else if (breakeven.breakeven_heads === null) {
    breakevenCardHtml = `
    <div class="card">
      <h2>จุดคุ้มทุนวันนี้</h2>
      <div class="empty-state"><p>กำไรขั้นต้นต่อหัวย้อนหลัง 30 วันติดลบหรือเป็นศูนย์ — คำนวณจุดคุ้มทุนไม่ได้ตอนนี้ (ลองตรวจสอบราคาขาย/ต้นทุนวัตถุดิบ)</p></div>

      <h2>ช่วงวันที่ดูข้อมูล</h2>

    ${alertsHtml}

    ${overheadCardHtml}

    <div class="card">
      <h2>รายรับ vs รายจ่าย</h2>
      ${buildRevenueExpenseChartSvg(salesReport.totals.total_revenue, totalExpense)}
      <div class="row-list" style="margin-top:14px;">
        <div class="row-item"><span class="label">ยอดขายบุฟเฟต์</span><span class="value">${formatMoney(salesReport.totals.sales_buffet)}</span></div>
        <div class="row-item"><span class="label">ยอดขายแยกจาน</span><span class="value">${formatMoney(salesReport.totals.sales_ala_carte)}</span></div>
        <div class="row-item"><span class="label">ยอดขายกลับบ้าน</span><span class="value">${formatMoney(salesReport.totals.sales_takeaway)}</span></div>
        <div class="row-item"><span class="label">ยอดขายน้ำ/ขนม</span><span class="value">${formatMoney(salesReport.totals.sales_addon)}</span></div>
        ${salesReport.totals.days_with_actual_revenue > 0
          ? `<div class="row-item"><span class="label">รายรับจริงรวม</span><span class="value">${formatMoney(salesReport.totals.total_actual_revenue)}</span></div>
             <div class="row-item"><span class="label">ส่วนต่างสะสม (จริง − ตามระบบ)</span><span class="value ${salesReport.totals.total_variance >= 0 ? 'profit-pos' : 'profit-neg'}">${salesReport.totals.total_variance >= 0 ? '+' : ''}${formatMoney(salesReport.totals.total_variance)}</span></div>`
          : ''}
        <div class="row-item"><span class="label">ต้นทุนวัตถุดิบ (COGS)</span><span class="value">${formatMoney(salesReport.totals.cogs)}</span></div>
        <div class="row-item"><span class="label">ค่าถุง</span><span class="value">${formatMoney(salesReport.totals.packaging_cost)}</span></div>
        <div class="row-item"><span class="label">ค่าใช้จ่ายประจำ</span><span class="value">${formatMoney(salesReport.totals.operating_expense)}</span></div>
        <div class="row-item"><span class="label" style="font-weight:700;">กำไรสุทธิรวม</span><span class="value ${salesReport.totals.net_profit >= 0 ? 'profit-pos' : 'profit-neg'}">${formatMoney(salesReport.totals.net_profit)}</span></div>
      </div>
    </div>

    <div class="card">
      <h2>จำนวนหัวลูกค้า</h2>
      <div class="row-list">
        <div class="row-item"><span class="label">บุฟเฟต์ผู้ใหญ่</span><span class="value">${headcount.adult_count} คน</span></div>
        <div class="row-item"><span class="label">บุฟเฟต์เด็ก</span><span class="value">${headcount.child_count} คน</span></div>

      <div class="row-list">${rowsHtml}</div>
    </div>

  });
  document.getElementById('dash-to').addEventListener('change', (e) => {
    renderDashboard(document.getElementById('dash-from').value, e.target.value);
  });
}

async function renderEntry(dateStr) {
  const date = dateStr || todayStr();
  const entry = await db.daily_entries.where('entry_date').equals(date).first();

  const categories = await listMenuCategories({ activeOnly: true });
  const items = await listMenuItems({ activeOnly: true });
  const existingSales = await db.daily_addon_sales.where('entry_date').equals(date).toArray();
  const salesMap = Object.fromEntries(existingSales.map((a) => [a.menu_item_id, a]));

  const buildItemRowsHtml = (categoryItems) =>
    categoryItems
      .map((item) => {
        const existingSale = salesMap[item.id];
        const priceForDay = existingSale ? existingSale.unit_price_snapshot : item.default_price;
        return `
        <div class="addon-row">
          <span class="name">${escapeHtml(item.name)}</span>
          <input type="number" min="0" step="any" class="price-input" data-price-for="${item.id}" data-default-price="${item.default_price}" value="${priceForDay}" style="width:72px;" title="ราคาวันนี้ (บาท) — แก้ได้ถ้าราคาจริงเปลี่ยนแล้วยังไม่ได้แก้ในระบบ" />
          <input type="number" min="0" inputmode="numeric" class="qty-input" data-menu-item-id="${item.id}" value="${existingSale?.quantity ?? 0}" title="จำนวนที่ขายได้" />
        </div>`;
      })
      .join('');

  const categorySectionsHtml = categories.length
    ? categories
        .map((cat) => {
          const catItems = items.filter((i) => i.category_id === cat.id);
          if (catItems.length === 0) return '';
          return `<h3>${escapeHtml(cat.name)}</h3>${buildItemRowsHtml(catItems)}`;
        })
        .join('')
    : '';

  const isClosed = entry?.is_closed === true;
  const itemsSubtotal = items.reduce((sum, item) => {
    const existingSale = salesMap[item.id];
    const price = existingSale ? existingSale.unit_price_snapshot : item.default_price;
    const qty = existingSale?.quantity ?? 0;
    return sum + price * qty;
  }, 0);
  const grandTotal = itemsSubtotal + (entry?.takeaway_total ?? 0);

  $content.innerHTML = `
    <h1 class="section-title">บันทึกยอดวันนี้</h1>
    <div class="card">
      <div class="field">
        <label for="f-date">วันที่</label>
        <input type="date" id="f-date" value="${date}" max="${todayStr()}" />
      </div>
      <div class="row-item" style="border-bottom:none; padding-top:0;">
        <label for="f-closed" style="margin-bottom:0; cursor:pointer;">ร้านปิดวันนี้ (ไม่มีการขาย)</label>
        <input type="checkbox" id="f-closed" ${isClosed ? 'checked' : ''} style="width:auto;" />
      </div>
    </div>

    <div id="sales-section" style="${isClosed ? 'display:none;' : ''}">
      <div class="card">
        <h2>ยอดขาย (ระบุจำนวนนับในแต่ละรายการ)</h2>
        <p style="font-size:13px;color:var(--ink-soft);margin-top:-10px;">แก้ราคาช่องกลางได้ถ้าราคาจริงเปลี่ยนไปแล้วแต่ยังไม่ได้แก้ในระบบ (ต้องระบุเหตุผลในช่องโน้ตด้านล่าง)</p>
        ${categorySectionsHtml || `<p style="color:var(--ink-soft); font-size:14px;">ยังไม่มีเมนู — เพิ่มได้ที่ "ตั้งค่าเมนู"</p>`}
        <div class="addon-row">
          <span class="name">กลับบ้าน <span style="color:var(--ink-soft)">(จำนวนบิล)</span></span>
          <input type="number" id="f-takeaway-count" min="0" inputmode="numeric" value="${entry?.takeaway_count ?? 0}" />
        </div>
        <div class="addon-row">
          <span class="name">กลับบ้าน <span style="color:var(--ink-soft)">(ยอดขายรวม บาท)</span></span>
          <input type="number" id="f-takeaway-total" min="0" inputmode="decimal" value="${entry?.takeaway_total ?? 0}" />
        </div>
        <div class="row-item" style="border-bottom:none;">
          <span class="label" style="font-weight:700;">ยอดขายรวมตามระบบ</span>
          <span class="value" id="f-grand-total">${formatMoney(grandTotal)}</span>
        </div>
      </div>

      <div class="card">
        <div class="field" style="margin-bottom:0;">
          <label for="f-actual-revenue">รายรับจริง (เงินสด/โอนที่นับได้จริงตอนปิดร้าน)</label>
          <input type="number" id="f-actual-revenue" min="0" inputmode="decimal" placeholder="เว้นว่างได้ถ้ายังไม่ได้นับ" value="${entry?.actual_revenue ?? ''}" />
          <p style="font-size:12px;color:var(--ink-soft);margin:6px 0 0;">ใช้เทียบกับยอดตามระบบด้านบน เพื่อจับส่วนต่างจากส่วนลด/แถม/นับผิด/เงินขาด — กำไรสุทธิของวันจะคำนวณจากช่องนี้แทนถ้ากรอกไว้</p>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="field" style="margin-bottom:0">
        <label for="f-note">โน้ต ${'<span style="color:var(--ember-deep);font-weight:400;">(ต้องระบุถ้ามีการแก้ราคา)</span>'}</label>
        <textarea id="f-note" rows="2">${escapeHtml(entry?.note || '')}</textarea>
      </div>
    </div>

    <button class="btn btn-primary" id="btn-save-entry">บันทึกยอดวันนี้</button>
    <div id="entry-result" style="margin-top:16px;"></div>
  `;

  document.getElementById('f-date').addEventListener('change', (e) => renderEntry(e.target.value));

  document.getElementById('f-closed').addEventListener('change', (e) => {
    document.getElementById('sales-section').style.display = e.target.checked ? 'none' : '';
  });

  function recalcGrandTotal() {
    let itemsSub = 0;
    document.querySelectorAll('.qty-input').forEach((qtyInput) => {
      const priceInput = document.querySelector(`[data-price-for="${qtyInput.dataset.menuItemId}"]`);
      itemsSub += (Number(qtyInput.value) || 0) * (Number(priceInput?.value) || 0);
    });
    const takeawayTotal = Number(document.getElementById('f-takeaway-total')?.value) || 0;
    const grandTotalEl = document.getElementById('f-grand-total');
    if (grandTotalEl) grandTotalEl.textContent = formatMoney(itemsSub + takeawayTotal);
  }
  document.getElementById('sales-section')?.addEventListener('input', recalcGrandTotal);

  document.getElementById('btn-save-entry').addEventListener('click', async () => {
    const targetDate = document.getElementById('f-date').value;
    const closed = document.getElementById('f-closed').checked;
    const note = document.getElementById('f-note').value || null;

    // ตรวจก่อนบันทึกจริง: ถ้ามีการแก้ราคาแถวไหนต่างจากราคาที่ตั้งค่าไว้ ต้องมีโน้ตกำกับเสมอ
    if (!closed) {
      const priceOverridden = Array.from(document.querySelectorAll('.price-input')).some(
        (input) => Number(input.value) !== Number(input.dataset.defaultPrice)
      );
      if (priceOverridden && !note) {
        showToast('มีการแก้ราคาสินค้า กรุณาระบุเหตุผลในช่องโน้ตก่อนบันทึก');
        return;
      }
    }

    try {
      const actualRevenueRaw = document.getElementById('f-actual-revenue')?.value;
      const actual_revenue = closed || actualRevenueRaw === '' || actualRevenueRaw == null ? null : Number(actualRevenueRaw);

      await upsertDailyEntry({
        entry_date: targetDate,
        is_closed: closed,
        takeaway_total: closed ? 0 : Number(document.getElementById('f-takeaway-total').value) || 0,
        takeaway_count: closed ? 0 : Number(document.getElementById('f-takeaway-count').value) || 0,
        actual_revenue,
        note,
        recorded_by: (await listShifts())[0]?.id ?? null,
      });

      if (!closed) {
        const qtyInputs = document.querySelectorAll('.qty-input');
        for (const qtyInput of qtyInputs) {
          const priceInput = document.querySelector(`[data-price-for="${qtyInput.dataset.menuItemId}"]`);
          const priceValue = Number(priceInput.value) || 0;
          const defaultPrice = Number(priceInput.dataset.defaultPrice);
          const isOverridden = priceValue !== defaultPrice;
          await recordAddonSale({
            entry_date: targetDate,
            menu_item_id: qtyInput.dataset.menuItemId,
            quantity: Number(qtyInput.value) || 0,
            unit_price_override: priceValue,
            price_override_reason: isOverridden ? note : null,
          });
        }
      }

      const summary = await db.daily_summary.where('summary_date').equals(targetDate).first();
      const variance = summary?.revenue_variance;
      const varianceRowHtml = summary && variance != null
        ? `<div class="row-item"><span class="label">รายรับจริง</span><span class="value">${formatMoney(summary.actual_revenue)}</span></div>
           <div class="row-item"><span class="label">ส่วนต่าง (จริง − ตามระบบ)</span><span class="value ${variance >= 0 ? 'profit-pos' : 'profit-neg'}">${variance >= 0 ? '+' : ''}${formatMoney(variance)}</span></div>`
        : '';

      document.getElementById('entry-result').innerHTML = summary
        ? `<div class="card">
             <h2>สรุปวันที่ ${targetDate}</h2>
             <div class="row-list">
               <div class="row-item"><span class="label">ยอดขายรวมตามระบบ</span><span class="value">${formatMoney(summary.calculated_revenue ?? (summary.sales_buffet + summary.sales_ala_carte + summary.sales_takeaway + summary.sales_addon))}</span></div>
               ${varianceRowHtml}
               <div class="row-item"><span class="label">ต้นทุนวัตถุดิบ (COGS)</span><span class="value">${formatMoney(summary.cogs)}</span></div>
               <div class="row-item"><span class="label">ค่าถุง</span><span class="value">${formatMoney(summary.packaging_cost)}</span></div>
               <div class="row-item"><span class="label">ค่าใช้จ่ายประจำ (เฉลี่ย/วัน)</span><span class="value">${formatMoney(summary.operating_expense)}</span></div>
               <div class="row-item"><span class="label" style="font-weight:700;">กำไรสุทธิ${variance != null ? ' (คิดจากรายรับจริง)' : ''}</span><span class="value ${summary.net_profit >= 0 ? 'profit-pos' : 'profit-neg'}">${formatMoney(summary.net_profit)}</span></div>
             </div>
           </div>`
        : '';

      showToast(closed ? 'บันทึกวันปิดร้านสำเร็จ' : 'บันทึกสำเร็จ');
      renderHeader();
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message);
      console.error(err);
    }
  });
}

// ------------------------------------------------------------
// View: ตั้งค่าเมนู (buffet packages + menu items)
// ------------------------------------------------------------
async function renderMenuSettings() {
  const categories = await listMenuCategories({ activeOnly: true });
  const items = await listMenuItems({ activeOnly: true });

  const categoryOptions = categories.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('') + `<option value="__new__">+ เพิ่มหมวดหมู่ใหม่...</option>`;

  const itemsListHtml = categories.length
    ? categories
        .map((cat) => {
          const catItems = items.filter((i) => i.category_id === cat.id);
          if (catItems.length === 0) return '';
          const rowsHtml = catItems
            .map(
              (item) => `
            <div class="row-item" style="align-items:center;">
              <span class="label">${escapeHtml(item.name)}</span>
              <span class="value" style="display:flex; align-items:center; gap:6px;">
                <input type="number" min="0" step="any" class="edit-price-input" data-item-id="${item.id}" data-current-price="${item.default_price}" value="${item.default_price}" style="width:76px;" />
                <button class="btn-ghost" data-save-price="${item.id}" style="padding:4px 8px; font-size:12px;">บันทึกราคา</button>
                <button class="btn-danger-text" data-remove-item="${item.id}">ลบ</button>
              </span>
            </div>`
            )
            .join('');
          return `<h3>${escapeHtml(cat.name)}</h3>${rowsHtml}`;
        })
        .join('')
    : `<div class="empty-state"><p>ยังไม่มีเมนู เพิ่มเมนูแรกด้านล่างได้เลย</p></div>`;

  $content.innerHTML = `
    <h1 class="section-title">ตั้งค่าเมนู</h1>

    <div class="card">
      <h2>รายการเมนู</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;">รวมบุฟเฟต์และเมนูอื่นๆ ไว้ในที่เดียว จัดกลุ่มตามหมวดหมู่ — แก้ราคาแล้วมีผลกับ "การบันทึกยอดวันใหม่" เท่านั้น ยอดที่บันทึกไปแล้วไม่เปลี่ยนตาม</p>
      <div class="row-list">${itemsListHtml}</div>
    </div>

    <div class="card">
      <h2>เพิ่มเมนูใหม่</h2>
      <div class="field">
        <label for="f-item-name">ชื่อเมนู</label>
        <input type="text" id="f-item-name" placeholder="เช่น โค้ก, มันฝรั่งทอด" />
      </div>
      <div class="field-grid">
        <div class="field">
          <label for="f-item-price">ราคา (บาท)</label>
          <input type="number" id="f-item-price" min="0" />
        </div>
        <div class="field">
          <label for="f-item-category">หมวดหมู่</label>
          <select id="f-item-category">${categoryOptions}</select>
        </div>
      </div>
      <div class="field" id="new-category-field" style="display:none;">
        <label for="f-new-category-name">ชื่อหมวดหมู่ใหม่</label>
        <input type="text" id="f-new-category-name" placeholder="เช่น ของหวาน" />
      </div>
      <button class="btn btn-ghost" id="btn-add-item">+ เพิ่มเมนู</button>
    </div>
  `;

  document.getElementById('f-item-category').addEventListener('change', (e) => {
    document.getElementById('new-category-field').style.display = e.target.value === '__new__' ? '' : 'none';
  });

  document.getElementById('btn-add-item').addEventListener('click', async () => {
    const name = document.getElementById('f-item-name').value.trim();
    if (!name) { showToast('กรุณาใส่ชื่อเมนู'); return; }
    try {
      let categoryId = document.getElementById('f-item-category').value;
      if (categoryId === '__new__') {
        const newCategoryName = document.getElementById('f-new-category-name').value.trim();
        if (!newCategoryName) { showToast('กรุณาใส่ชื่อหมวดหมู่ใหม่'); return; }
        const newCategory = await createMenuCategory({ name: newCategoryName, display_order: categories.length + 1 });
        categoryId = newCategory.id;
      }
      await createMenuItem({
        category_id: categoryId,
        name,
        default_price: Number(document.getElementById('f-item-price').value) || 0,
        item_type: 'standard',
      });
      showToast('เพิ่มเมนูสำเร็จ');
      renderMenuSettings();
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message);
    }
  });

  document.querySelectorAll('[data-remove-item]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const result = await removeMenuItem(btn.dataset.removeItem);
      showToast(result.deleted ? 'ลบเมนูสำเร็จ' : 'ซ่อนเมนูแล้ว (เคยมีประวัติขายอยู่ ลบจริงไม่ได้)');
      renderMenuSettings();
    });
  });

  document.querySelectorAll('[data-save-price]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const itemId = btn.dataset.savePrice;
      const input = document.querySelector(`.edit-price-input[data-item-id="${itemId}"]`);
      const newPrice = Number(input.value);
      if (Number.isNaN(newPrice) || newPrice < 0) { showToast('ราคาไม่ถูกต้อง'); return; }
      if (newPrice === Number(input.dataset.currentPrice)) { showToast('ราคาไม่เปลี่ยนแปลง'); return; }
      try {
        await updateMenuItem(itemId, { default_price: newPrice });
        showToast('บันทึกราคาใหม่แล้ว (มีผลกับการบันทึกยอดวันถัดไป ไม่กระทบยอดที่บันทึกไปแล้ว)');
        renderMenuSettings();
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  });
}

// View: เพิ่มเติม (placeholder — โมดูลถัดไป)
// ------------------------------------------------------------
async function renderMore() {
  $content.innerHTML = `
    <h1 class="section-title">เพิ่มเติม</h1>
    <div class="card">
      <div class="row-list">
        <div class="row-item" style="cursor:pointer;" data-goto-sub="reports">
          <span class="label" style="font-weight:700;color:var(--ink);">รายงาน</span>
          <span class="value" style="color:var(--ember-deep);">เปิด →</span>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>สำรองข้อมูล</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;">ย้ายข้อมูลทั้งหมดไปเครื่องอื่น หรือสำรองไว้กันข้อมูลหาย</p>
      <button class="btn btn-ghost" id="btn-export" style="margin-bottom:10px;">ดาวน์โหลดไฟล์สำรองข้อมูล</button>
      <label for="import-file" class="btn btn-primary" style="text-align:center; display:block;">นำเข้าไฟล์สำรองข้อมูล</label>
      <input type="file" id="import-file" accept="application/json" style="display:none;" />
    </div>
  `;

  document.querySelectorAll('[data-goto-sub]').forEach((el) => {
    el.addEventListener('click', () => navigate(el.dataset.gotoSub));
  });

  document.getElementById('btn-export').addEventListener('click', async () => {
    const data = await exportAllData();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tuadueng-backup-${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('import-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!confirm('การนำเข้าจะลบข้อมูลปัจจุบันทั้งหมดแล้วแทนที่ด้วยไฟล์นี้ ยืนยันหรือไม่?')) return;
    try {
      const text = await file.text();
      const result = await importAllData(JSON.parse(text));
      showToast(
        result.missing_tables.length > 0
          ? `นำเข้าสำเร็จ แต่ไฟล์นี้ไม่มีข้อมูลตาราง: ${result.missing_tables.join(', ')}`
          : 'นำเข้าข้อมูลสำเร็จ'
      );
      renderHeader();
      navigate('dashboard');
    } catch (err) {
      showToast('นำเข้าไม่สำเร็จ: ' + err.message);
    }
  });
}

// ------------------------------------------------------------
// View: การเงิน (Finance) — ต้นทุนคงที่ (เช่า/น้ำ/ไฟ/เน็ต + แก๊ส + ค่าแรงอื่นๆ)
// ------------------------------------------------------------

// จำไว้ว่าตอนนี้เลือกดูต้นทุนประเภทไหนอยู่ในการ์ด "ต้นทุนคงที่" (คงค่าไว้ข้ามการ re-render ระหว่างอยู่หน้านี้)
let financeActiveCostType = 'rent';

/** เนื้อหาด้านในของการ์ด "ต้นทุนคงที่" สำหรับ cost_type ที่เลือกอยู่ (ไม่รวม card wrapper/segmented control
 *  เพราะ 4 ประเภทแชร์การ์ดเดียวกัน สลับดูทีละประเภทผ่านปุ่มด้านบนแทนที่จะแยกเป็น 4 การ์ด) */
function buildFixedCostInnerHtml(cost_type, current, history) {
  const label = FIXED_COST_LABELS[cost_type];
  const historyHtml = history.length
    ? history
        .map((r) => {
          const isOpen = r.effective_to === null;
          const rangeLabel = isOpen ? `${r.effective_from} — ปัจจุบัน` : `${r.effective_from} — ${r.effective_to}`;
          return `
        <div class="row-item">
          <span class="label">${rangeLabel}${r.note ? ` <span style="color:var(--ink-soft)">(${escapeHtml(r.note)})</span>` : ''}${isOpen ? ' <span class="stamp ok" style="padding:2px 8px;font-size:11px;">ปัจจุบัน</span>' : ''}
            <button class="btn-danger-text" data-remove-fc="${r.id}">ลบ</button>
          </span>
          <span class="value">${formatMoney(r.amount)}</span>
        </div>`;
        })
        .join('')
    : `<div class="empty-state"><p>ยังไม่มีประวัติ${label} — เพิ่มรายการแรกด้านล่างได้เลย</p></div>`;

  const statusHtml = current
    ? `<div class="row-item" style="border-bottom:none;">
        <span class="label">${label}ปัจจุบัน <span style="color:var(--ink-soft)">(มีผลตั้งแต่ ${current.effective_from})</span></span>
        <span class="value" style="font-size:18px;">${formatMoney(current.amount)}</span>
      </div>`
    : `<div class="empty-state"><p>ยังไม่มีรอบเปิดต่อเนื่องของ${label} — ถ้าจ่ายเป็นบิลปิดรอบทุกเดือน ไม่ต้องกังวล เพิ่มรายการด้านล่างพร้อมระบุ "ถึงวันที่" ได้เลย</p></div>`;

  return `
    ${statusHtml}
    <div class="field-grid" style="margin-top:12px;">
      <div class="field">
        <label for="fc-${cost_type}-amount">จำนวนเงิน (บาท)</label>
        <input type="number" id="fc-${cost_type}-amount" min="0" value="${current ? current.amount : ''}" />
      </div>
      <div class="field">
        <label for="fc-${cost_type}-from">มีผลตั้งแต่วันที่</label>
        <input type="date" id="fc-${cost_type}-from" value="${todayStr()}" />
      </div>
    </div>
    <div class="field-grid">
      <div class="field">
        <label for="fc-${cost_type}-to">ถึงวันที่ (ไม่บังคับ)</label>
        <input type="date" id="fc-${cost_type}-to" />
      </div>
      <div class="field">
        <label for="fc-${cost_type}-note">หมายเหตุ</label>
        <input type="text" id="fc-${cost_type}-note" />
      </div>
    </div>
    <p style="font-size:12px;color:var(--ink-soft);margin:2px 0 8px;">เว้น "ถึงวันที่" ว่างไว้ = ใช้ยอดนี้ต่อเนื่องจนกว่าจะมีรายการใหม่มาแทน (เหมาะกับค่าเช่าที่ไม่ค่อยเปลี่ยน) — ใส่ "ถึงวันที่" ชัดเจน = เฉพาะรอบบิลนี้เท่านั้น (เหมาะกับบิลรายเดือนที่ยอดไม่เท่ากันทุกเดือน)</p>
    <button class="btn btn-ghost" data-add-fc="${cost_type}">+ บันทึก${label}</button>
    <details style="margin-top:14px;">
      <summary style="cursor:pointer;font-weight:700;">ดูประวัติทั้งหมด (${history.length})</summary>
      <div class="row-list" style="margin-top:8px;">${historyHtml}</div>
    </details>`;
}

// ------------------------------------------------------------
async function renderFinance() {
  const expenses = await listOperatingExpenses({ activeOnly: true });

  const fixedCostData = {};
  for (const type of FIXED_COST_TYPES) {
    fixedCostData[type] = {
      current: await getCurrentFixedCost(type),
      history: await listFixedCostHistory(type),
    };
  }

  const gasHistory = await listGasPurchases();
  const gasEstimate = await getDailyGasCost(todayStr());
  const lastGasCost = gasHistory.length ? gasHistory[0].cost_per_tank : '';

  const gasHistoryHtml = gasHistory.length
    ? gasHistory
        .map(
          (g) => `
        <div class="row-item">
          <span class="label">${g.purchase_date} — ${g.tanks_qty} ถัง × ${formatMoney(g.cost_per_tank)}${g.note ? ` <span style="color:var(--ink-soft)">(${escapeHtml(g.note)})</span>` : ''}
            <button class="btn-danger-text" data-remove-gas="${g.id}">ลบ</button>
          </span>
          <span class="value">${formatMoney(g.total_cost)}</span>
        </div>`
        )
        .join('')
    : `<div class="empty-state"><p>ยังไม่เคยบันทึกการซื้อแก๊สเลย</p></div>`;

  const expensesListHtml = expenses.length
    ? expenses
        .map((e) => {
          const freqLabel =
            e.frequency === 'daily'
              ? 'รายวัน (เต็มจำนวนทุกวัน)'
              : e.frequency === 'weekly'
              ? 'รายสัปดาห์ (เฉลี่ย/วัน)'
              : e.frequency === 'once'
              ? `ครั้งเดียว ${e.start_date}`
              : 'รายเดือน (เฉลี่ย/วัน)';
          return `
        <div class="row-item">
          <span class="label">${escapeHtml(e.name)} <span style="color:var(--ink-soft)">(${freqLabel})</span></span>
          <span class="value">${formatMoney(e.amount)}
            <button class="btn-edit-text" data-edit-expense="${e.id}">แก้ผิดพลาด</button>
            <button class="btn-edit-text" data-change-rate-expense="${e.id}">เปลี่ยนยอดตั้งแต่วันนี้</button>
            <button class="btn-danger-text" data-remove-expense="${e.id}">ลบ</button>
          </span>
        </div>`;
        })
        .join('')
    : `<div class="empty-state"><p>ยังไม่มีค่าใช้จ่ายประจำ</p></div>`;

  $content.innerHTML = `
    <h1 class="section-title">การเงิน</h1>

    <div class="card">
      <h2>ต้นทุนคงที่รายเดือน</h2>
      <div style="display:flex;gap:6px;margin-bottom:14px;">
        ${FIXED_COST_TYPES.map(
          (t) => `<button class="btn btn-small ${t === financeActiveCostType ? 'btn-primary' : 'btn-ghost'}" data-select-fc-type="${t}" style="flex:1;">${FIXED_COST_LABELS[t]}</button>`
        ).join('')}
      </div>
      ${buildFixedCostInnerHtml(financeActiveCostType, fixedCostData[financeActiveCostType].current, fixedCostData[financeActiveCostType].history)}
    </div>

    <div class="card">
      <h2>ค่าแก๊สหุงต้ม</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;">
        บันทึกทุกครั้งที่<strong>สั่งซื้อ/เติมถัง</strong> (ไม่ผูกกับรอบเดือน เพราะหมดแล้วสั่งเพิ่มไม่ตรงรอบ) ระบบจะประมาณต้นทุน/วันจากอัตราการใช้ย้อนหลัง ${gasEstimate.basis_days || 30} วันให้อัตโนมัติ
        ${gasEstimate.purchases_count > 0 ? ` — ตอนนี้ประมาณ ${formatMoney(gasEstimate.value)}/วัน${gasEstimate.is_estimated ? ' (ประมาณการจากประวัติ เพราะช่วงนี้ยังไม่มีการซื้อใหม่)' : ''}` : ' — ยังไม่มีข้อมูลพอประมาณการ'}
      </p>
      <div class="field-grid">
        <div class="field">
          <label for="gas-date">วันที่ซื้อ</label>
          <input type="date" id="gas-date" value="${todayStr()}" max="${todayStr()}" />
        </div>
        <div class="field">
          <label for="gas-tanks">จำนวนถัง</label>
          <input type="number" id="gas-tanks" min="1" />
        </div>
      </div>
      <div class="field">
        <label for="gas-cost">ราคาต่อถัง (บาท)</label>
        <input type="number" id="gas-cost" min="0" value="${lastGasCost}" />
      </div>
      <div class="field">
        <label for="gas-note">หมายเหตุ (ไม่บังคับ)</label>
        <input type="text" id="gas-note" placeholder="เช่น ร้านประจำ, ราคาขึ้นรอบนี้" />
      </div>
      <button class="btn btn-ghost" id="btn-add-gas">+ บันทึกการซื้อแก๊ส</button>

      <details style="margin-top:18px;">
        <summary style="cursor:pointer;font-weight:700;">ดูประวัติการซื้อแก๊ส (${gasHistory.length})</summary>
        <div class="row-list" style="margin-top:8px;">${gasHistoryHtml}</div>
      </details>
    </div>

    <div class="card">
      <h2>ค่าแรง / ค่าใช้จ่ายประจำอื่นๆ</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:-6px;">สำหรับรายการที่ไม่ใช่ค่าเช่า/น้ำ/ไฟ/เน็ต/แก๊ส เช่น ค่าแรงพนักงาน (เลือกความถี่ตามรอบจ่ายจริงได้ วัน/สัปดาห์/เดือน) หรือค่าซ่อมบำรุงเฉพาะครั้ง — คิดเข้า P&L อัตโนมัติทุกวัน<br/><strong style="color:var(--ember-deep)">อย่าเพิ่ม "ค่าเช่า", "ค่าน้ำ/ค่าไฟ", "เน็ต" หรือ "ค่าแก๊ส" ที่นี่ซ้ำ</strong> เพราะย้ายไปจัดการในการ์ดด้านบนแล้ว</p>
      <div class="row-list">${expensesListHtml}</div>
    </div>

    <div class="card">
      <h2 id="exp-form-title">เพิ่มค่าใช้จ่ายประจำ</h2>
      <input type="hidden" id="exp-edit-id" value="" />
      <input type="hidden" id="exp-change-id" value="" />
      <div class="field">
        <label for="exp-name">ชื่อรายการ</label>
        <input type="text" id="exp-name" placeholder="เช่น ค่าแรงพนักงาน, ค่าซ่อมบำรุง (ไม่ใช่ค่าเช่า/น้ำ/ไฟ/เน็ต/แก๊ส)" />
      </div>
      <div class="field-grid">
        <div class="field">
          <label for="exp-amount">จำนวนเงิน (บาท)</label>
          <input type="number" id="exp-amount" min="0" />
        </div>
        <div class="field">
          <label for="exp-frequency">ความถี่</label>
          <select id="exp-frequency">
            <option value="daily">รายวัน (เต็มจำนวนทุกวัน)</option>
            <option value="weekly">รายสัปดาห์ (เฉลี่ย/วัน)</option>
            <option value="monthly" selected>รายเดือน (เฉลี่ย/วัน)</option>
            <option value="once">ครั้งเดียว (ลงเต็มจำนวนวันเดียว)</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="exp-start-date" id="exp-start-date-label">เริ่มมีผลตั้งแต่วันที่</label>
        <input type="date" id="exp-start-date" value="${todayStr()}" />
        <p style="font-size:12px;color:var(--ink-soft);margin:6px 0 0;">
          <strong>รายวัน:</strong> เหมาะกับค่าแรงพนักงานรายวัน ลงเต็มจำนวนทุกวันที่ active ไม่หารเฉลี่ย<br/>
          <strong>รายสัปดาห์/รายเดือน:</strong> เหมาะกับค่าแรงประจำที่จ่ายเป็นรอบ เฉลี่ยเป็นต้นทุน/วันให้อัตโนมัติ<br/>
          <strong>ครั้งเดียว:</strong> เหมาะกับของที่จ่ายไม่สม่ำเสมอ เช่น ค่าซ่อมบำรุงเฉพาะครั้ง — ลงเต็มจำนวนในวันที่ระบุวันเดียว
        </p>
      </div>
      <button class="btn btn-ghost" id="btn-add-expense">+ เพิ่มค่าใช้จ่าย</button>
      <button class="btn-danger-text" id="btn-cancel-edit-expense" style="display:none;">ยกเลิกการแก้ไข</button>
    </div>
  `;

  document.querySelectorAll('[data-select-fc-type]').forEach((btn) => {
    btn.addEventListener('click', () => {
      financeActiveCostType = btn.dataset.selectFcType;
      renderFinance();
    });
  });

  document.querySelectorAll('[data-add-fc]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const cost_type = btn.dataset.addFc;
      const label = FIXED_COST_LABELS[cost_type];
      const amount = Number(document.getElementById(`fc-${cost_type}-amount`).value);
      const effective_from = document.getElementById(`fc-${cost_type}-from`).value;
      const effective_to = document.getElementById(`fc-${cost_type}-to`).value || null;
      const note = document.getElementById(`fc-${cost_type}-note`).value.trim() || null;
      if (!(amount >= 0)) { showToast('กรุณาใส่จำนวนเงินให้ถูกต้อง'); return; }
      if (!effective_from) { showToast('กรุณาเลือกวันที่เริ่มมีผล'); return; }
      const rangeLabel = effective_to ? `${effective_from} ถึง ${effective_to}` : `${effective_from} เป็นต้นไป (จนกว่าจะเปลี่ยน)`;
      if (!confirm(`ยืนยันบันทึก${label} ${formatMoney(amount)} มีผล ${rangeLabel}?`)) return;
      try {
        const result = await addFixedCostEntry({ cost_type, amount, effective_from, effective_to, note });
        showToast(
          result.regenerated_dates_count > 0
            ? `บันทึก${label}สำเร็จ — อัปเดต P&L ย้อนหลังแล้ว ${result.regenerated_dates_count} วัน`
            : `บันทึก${label}สำเร็จ`
        );
        renderFinance();
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
    });
  });

  document.querySelectorAll('[data-remove-fc]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('ลบรายการนี้? P&L ของช่วงวันที่เกี่ยวข้องจะถูกคำนวณใหม่')) return;
      const result = await removeFixedCostEntry(btn.dataset.removeFc);
      showToast(
        result.regenerated_dates_count > 0 ? `ลบรายการแล้ว — อัปเดต P&L ย้อนหลังแล้ว ${result.regenerated_dates_count} วัน` : 'ลบรายการแล้ว'
      );
      renderFinance();
    });
  });

  document.getElementById('btn-add-gas').addEventListener('click', async () => {
    const purchase_date = document.getElementById('gas-date').value;
    const tanks_qty = Number(document.getElementById('gas-tanks').value);
    const cost_per_tank = Number(document.getElementById('gas-cost').value);
    const note = document.getElementById('gas-note').value.trim() || null;
    try {
      const result = await recordGasPurchase({ purchase_date, tanks_qty, cost_per_tank, note });
      showToast(
        result.regenerated_dates_count > 0
          ? `บันทึกการซื้อแก๊สสำเร็จ — อัปเดตค่าประมาณการย้อนหลังแล้ว ${result.regenerated_dates_count} วัน`
          : 'บันทึกการซื้อแก๊สสำเร็จ'
      );
      renderFinance();
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message);
    }
  });

  document.querySelectorAll('[data-remove-gas]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('ลบรายการซื้อแก๊สนี้? ค่าประมาณการรายวันของช่วงนั้นจะเปลี่ยนไปตาม')) return;
      await removeGasPurchase(btn.dataset.removeGas);
      showToast('ลบรายการซื้อแก๊สแล้ว');
      renderFinance();
    });
  });

  document.querySelectorAll('[data-edit-expense]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const exp = expenses.find((x) => x.id === btn.dataset.editExpense);
      if (!exp) return;
      document.getElementById('exp-edit-id').value = exp.id;
      document.getElementById('exp-change-id').value = '';
      document.getElementById('exp-name').value = exp.name;
      document.getElementById('exp-amount').value = exp.amount;
      document.getElementById('exp-frequency').value = exp.frequency;
      document.getElementById('exp-start-date').value = exp.start_date || '';
      document.getElementById('exp-form-title').textContent = `แก้ผิดพลาด: ${exp.name}`;
      document.getElementById('btn-add-expense').textContent = 'บันทึกการแก้ไข';
      document.getElementById('btn-cancel-edit-expense').style.display = 'inline-block';
      document.getElementById('exp-form-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });

  document.querySelectorAll('[data-change-rate-expense]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const exp = expenses.find((x) => x.id === btn.dataset.changeRateExpense);
      if (!exp) return;
      document.getElementById('exp-change-id').value = exp.id;
      document.getElementById('exp-edit-id').value = '';
      document.getElementById('exp-name').value = exp.name;
      document.getElementById('exp-amount').value = '';
      document.getElementById('exp-frequency').value = exp.frequency;
      document.getElementById('exp-start-date').value = todayStr();
      document.getElementById('exp-form-title').textContent = `เปลี่ยนยอด "${exp.name}" ตั้งแต่วันที่ระบุ (ยอดเก่าไม่กระทบ)`;
      document.getElementById('btn-add-expense').textContent = 'บันทึกยอดใหม่';
      document.getElementById('btn-cancel-edit-expense').style.display = 'inline-block';
      document.getElementById('exp-form-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });

  document.getElementById('btn-cancel-edit-expense').addEventListener('click', () => {
    document.getElementById('exp-edit-id').value = '';
    document.getElementById('exp-change-id').value = '';
    document.getElementById('exp-name').value = '';
    document.getElementById('exp-amount').value = '';
    document.getElementById('exp-frequency').value = 'monthly';
    document.getElementById('exp-start-date').value = todayStr();
    document.getElementById('exp-form-title').textContent = 'เพิ่มค่าใช้จ่ายประจำ';
    document.getElementById('btn-add-expense').textContent = '+ เพิ่มค่าใช้จ่าย';
    document.getElementById('btn-cancel-edit-expense').style.display = 'none';
  });

  document.getElementById('btn-add-expense').addEventListener('click', async () => {
    const editId = document.getElementById('exp-edit-id').value;
    const changeId = document.getElementById('exp-change-id').value;
    const name = document.getElementById('exp-name').value.trim();

    if (changeId) {
      const new_amount = Number(document.getElementById('exp-amount').value) || 0;
      const effective_from = document.getElementById('exp-start-date').value;
      if (!effective_from) { showToast('กรุณาเลือกวันที่เริ่มมีผล'); return; }
      if (!confirm(`ยืนยันเปลี่ยนยอด "${name}" เป็น ${formatMoney(new_amount)} ตั้งแต่วันที่ ${effective_from}? ยอดก่อนหน้าจะไม่ถูกแตะต้อง`)) return;
      try {
        const result = await changeOperatingExpenseRate(changeId, { new_amount, effective_from });
        showToast(
          result.regenerated_dates_count > 0
            ? `เปลี่ยนยอดสำเร็จ — อัปเดต P&L ตั้งแต่ ${effective_from} แล้ว ${result.regenerated_dates_count} วัน`
            : 'เปลี่ยนยอดสำเร็จ'
        );
        renderFinance();
      } catch (err) {
        showToast('เกิดข้อผิดพลาด: ' + err.message);
      }
      return;
    }

    if (/เช่า|น้ำ|ไฟ|เน็ต|แก๊ส|internet|gas/i.test(name) && !confirm(`"${name}" ฟังดูคล้ายค่าเช่า/น้ำ/ไฟ/เน็ต/แก๊ส ซึ่งมีการ์ดจัดการแยกไว้ด้านบนแล้ว (กันนับซ้ำ) ยืนยันว่าต้องการเพิ่มเป็นค่าใช้จ่ายทั่วไปจริงๆ?`)) return;
    if (!name) { showToast('กรุณาใส่ชื่อรายการ'); return; }
    const payload = {
      name,
      amount: Number(document.getElementById('exp-amount').value) || 0,
      frequency: document.getElementById('exp-frequency').value,
      start_date: document.getElementById('exp-start-date').value,
    };
    try {
      if (editId) {
        if (!confirm('แก้ยอดนี้จะกระทบ P&L ย้อนหลังทุกวันที่รายการนี้เคย active มาก่อนด้วย\n\nถ้าราคาต่างกันจริงตั้งแต่วันหนึ่ง ใช้ปุ่ม "เปลี่ยนยอดตั้งแต่วันนี้" แทนจะแม่นกว่า (ไม่กระทบยอดเก่า)\n\nยืนยันแก้ไขทับของเดิมเลยหรือไม่?')) return;
        const result = await updateOperatingExpense(editId, payload);
        showToast(
          result.regenerated_dates_count > 0
            ? `แก้ไขสำเร็จ — อัปเดต P&L ย้อนหลังแล้ว ${result.regenerated_dates_count} วัน`
            : 'แก้ไขสำเร็จ'
        );
      } else {
        await createOperatingExpense(payload);
        showToast('เพิ่มค่าใช้จ่ายประจำสำเร็จ');
      }
      renderFinance();
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message);
    }
  });

  document.querySelectorAll('[data-remove-expense]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const result = await removeOperatingExpense(btn.dataset.removeExpense);
      showToast(result.deleted ? 'ลบค่าใช้จ่ายประจำสำเร็จ' : 'ซ่อนรายการแล้ว (เคยมีประวัติจ่ายจริงอยู่ ลบจริงไม่ได้ — แนะนำตั้งวันที่สิ้นสุดแทน)');
      renderFinance();
    });
  });
}

// ------------------------------------------------------------
// View: รายงาน (Reports)
// ------------------------------------------------------------
async function renderReports(fromParam, toParam) {
  const today = todayStr();
  const defaultFrom = fromParam || `${today.slice(0, 7)}-01`; // ต้นเดือนปัจจุบัน
  const from = defaultFrom;
  const to = toParam || today;

  const [topItems, monthly, expenseBreakdown, weekday] = await Promise.all([
    getTopSellingAddons(from, to, 10),
    getMonthlyBreakdown(from, to),
    getExpenseBreakdown(from, to),
    getWeekdayBreakdown(from, to),
  ]);

  const topItemsHtml = topItems.length
    ? topItems
        .map(
          (item, idx) => `
        <div class="row-item">
          <span class="label">${idx + 1}. ${escapeHtml(item.name)}</span>
          <span class="value">${item.total_quantity} หน่วย (${formatMoney(item.total_revenue)})</span>
        </div>`
        )
        .join('')

  const monthlyHtml = monthly.length

            </tr>
          </thead>
          <tbody>

                  <td style="padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;">${formatMoney(revenue)}</td>
                  <td style="padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;">${formatMoney(cost)}</td>
                  <td style="padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;" class="${m.net_profit >= 0 ? 'profit-pos' : 'profit-neg'}">${formatMoney(m.net_profit)}</td>
                </tr>`;
              })
              .join('')}
          </tbody>
        </table>
      </div>`
    : `<div class="empty-state"><p>ยังไม่มีข้อมูลในช่วงนี้</p></div>`;

  const maxExpense = expenseBreakdown.length ? Math.max(...expenseBreakdown.map((e) => e.total_amount)) : 1;
  const expenseBreakdownHtml = expenseBreakdown.length
    ? expenseBreakdown
        .map(
          (e) => `
        <div style="margin-bottom:10px;">
          <div class="row-item" style="border-bottom:none;padding-bottom:4px;">
            <span class="label">${escapeHtml(e.category)}</span>
            <span class="value">${formatMoney(e.total_amount)}</span>
          </div>
          <div style="background:var(--line);border-radius:4px;height:8px;overflow:hidden;">
            <div style="background:var(--ember);height:100%;width:${(e.total_amount / maxExpense) * 100}%;"></div>
          </div>
        </div>`
